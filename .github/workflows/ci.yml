# 타입 검사와 빌드가 깨진 채로 main 에 들어가지 않게 막는다.
#
# 이 레포에는 앱이 둘 있고 서로 별개다 (설계 원칙 5).
#   pca-platform/            검사 플랫폼
#   pca-platform/marketing/  나라별 소개 사이트
# 소개 사이트는 SITE 로 원고를 갈아 끼우므로 나라마다 따로 빌드해 본다.
# 나라를 추가하면 아래 matrix 에 한 줄 넣는다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 밀면 앞의 실행은 접는다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: 플랫폼
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pca-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pca-platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # DB 없이 빌드된다. 값이 필요한 곳은 전부 실행 시점에 읽는다
      - run: npm run build

  marketing:
    name: 소개 사이트 (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [global, kr]
    defaults:
      run:
        working-directory: pca-platform/marketing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pca-platform/marketing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          SITE: ${{ matrix.site }}

      # 타입 검사와 빌드로는 화면이 실제로 넘어가는지 알 수 없다.
      # 요금제를 눌러도 홈이 나오던 버그가 그랬다 — 타입도 맞고 빌드도 됐다.
      # 그래서 뽑아낸 미리보기를 브라우저로 열어 경로마다 확인한다.
      - name: 브라우저 준비
        run: npx playwright install --with-deps chromium

      - name: 미리보기 경로 확인
        env:
          SITE: ${{ matrix.site }}
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3100/ || {
            echo "서버가 뜨지 않았습니다"; exit 1;
          }
          node scripts/export-preview.mjs "$SITE" "/tmp/preview-$SITE.html"
          node scripts/check-preview.mjs "/tmp/preview-$SITE.html"
