# 세종 가지 전용 검증. 세종 세션은 npm 레지스트리가 막혀 `npm ci` · `next build` ·
# 브라우저 E2E 를 직접 못 돌린다. 같은 일을 GitHub 러너에서 한다.
#
# 보안 (2026-10-20 지시)
# - GITHUB_TOKEN 은 `contents: read` 만. 저장소에 아무것도 커밋·푸시하지 않는다.
# - 테스트 자료는 러너 안의 일회용 PostgreSQL 과 합성 DEMO 시드뿐이다. 운영·Staging
#   DB·Railway·실제 개인정보·기업 비공개 자료·저장소 비밀번호를 쓰지 않는다.
# - 시연 계정 비밀번호는 실행마다 무작위로 만들고 로그에서 가린다.
# - 공개 저장소의 Actions artifact 는 로그인한 누구나 받을 수 있다. 그래서 **글로 된
#   결과만** 올리고, 화면 캡처·PDF 는 `SEJONG_ARTIFACT_KEY` 비밀값이 있을 때만
#   AES-256 으로 잠근 파일로 올린다(보관 3일). 비밀값이 없으면 올리지 않는다.
#
# 언제 도는가: 손으로 (workflow_dispatch), 또는 커밋 메시지에 `[sejong-verify]` 가
# 있는 푸시만. 그 밖의 푸시는 일을 하지 않고, 돌고 있는 검증을 취소하지도 않는다.
name: sejong-verify

on:
  workflow_dispatch:
  push:
    branches: [claude/epic-galileo-lrvgxr]

permissions:
  contents: read

env:
  BASE_SHA: 0bff307c41aac286549a9a85503e4a9af162ca9e
  OUT: var/sejong-ci
  SHOTS: var/sejong-ci/shots

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sejong-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: sejong-verify
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm-ci-only
          POSTGRES_DB: cm_head
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cm" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: pca-platform
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pca-platform/package-lock.json

      - name: 도구 · 실행마다 새로 만드는 시연 비밀번호
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client poppler-utils fonts-noto-cjk >/dev/null
          mkdir -p "$OUT/logs" "$SHOTS"
          for k in SJ_PW_ADMIN SJ_PW_COUNSEL SJ_PW_SEEKER SJ_PW_VIRTUAL AUTH_SECRET; do
            v="$(openssl rand -base64 24 | tr -d '/+=')"; echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"
          done
          printf 'sha\t%s\nbase\t%s\nrun_id\t%s\nrun_url\t%s\nat\t%s\nnode\t%s\n' \
            "$GITHUB_SHA" "$BASE_SHA" "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(date -u +%FT%TZ)" "$(node -v)" > "$OUT/meta.tsv"
          : > "$OUT/steps.tsv"

      - name: npm ci
        run: |
          npm ci --no-audit --no-fund; rc=$?
          printf 'npm ci\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: 전체 TypeScript 검사
        run: |
          npm run -s typecheck > "$OUT/logs/typecheck.log" 2>&1; rc=$?
          tail -30 "$OUT/logs/typecheck.log"
          printf 'typecheck (tsc --noEmit)\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: Next.js 실제 빌드
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build > "$OUT/logs/build.log" 2>&1; rc=$?
          tail -40 "$OUT/logs/build.log"
          printf 'next build\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: DB 두 벌 (HEAD · 기준) — 공통 체인
        env:
          PGPASSWORD: cm-ci-only
        run: |
          psql -h 127.0.0.1 -U cm -d cm_head -qc "CREATE DATABASE cm_base"
          rc=0
          for db in cm_head cm_base; do
            for f in $(node -e 'const c=require("./deploy/db-chain.json");for(const f of [...c.base,...c.upgrade])console.log(f)'); do
              psql "postgres://cm:cm-ci-only@127.0.0.1:5432/$db" -q -v ON_ERROR_STOP=1 --single-transaction -f "$f" \
                >> "$OUT/logs/db-chain.log" 2>&1 || { echo "실패: $db $f"; rc=1; }
            done
          done
          printf 'db chain (HEAD·기준)\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: 회귀 — 세종 HEAD
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_head
        run: bash scripts/sejong/ci-regression.sh . "$OUT/head.tsv"

      - name: 회귀 — 기준 0bff307c
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_base
        run: |
          git worktree add -q ../../base "$BASE_SHA"
          ln -s "$PWD/node_modules" ../../base/pca-platform/node_modules
          bash scripts/sejong/ci-regression.sh ../../base/pca-platform "$PWD/$OUT/base.tsv"

      - name: 세종 분석 23
        run: |
          node --experimental-strip-types --no-warnings scripts/sejong/analysis-check.mjs > "$OUT/logs/analysis.log" 2>&1
          rc=$?; tail -5 "$OUT/logs/analysis.log"
          printf 'sejong analysis 23\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: 세종 DB 층 · 합성 시드 · 접근 경계
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_head
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f db/sejong/schema_sejong_demo.sql
          S="$RUNNER_TEMP/sj-seed.sql"
          node --experimental-strip-types --no-warnings scripts/sejong/seed-demo.mjs > "$S" 2>/dev/null
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 --single-transaction -f "$S"; rm -f "$S"
          node scripts/sejong/db-check.mjs > "$OUT/logs/db-check.log" 2>&1; rc=$?
          cat "$OUT/logs/db-check.log"
          printf 'sejong db·권한 검사\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: 공통 파일 무변경 확인
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- . \
            ':!docs/sejong' ':!db/sejong' ':!src/sejong' ':!src/app/sejong' ':!scripts/sejong' > "$OUT/shared-diff.txt"
          n=$(wc -l < "$OUT/shared-diff.txt"); cat "$OUT/shared-diff.txt"
          printf 'shared files changed = %s\t%s\n' "$n" $([ "$n" = 0 ] && echo 0 || echo 1) >> "$OUT/steps.tsv"

      - name: 브라우저 (빌드에 쓰인 playwright 와 같은 판)
        run: npx playwright install --with-deps chromium > /dev/null

      - name: standalone 서버 → 브라우저 E2E · PDF
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_head
        run: |
          export APP_ENV=staging PORT=3100 HOSTNAME=127.0.0.1
          export PLATFORM_URL=http://127.0.0.1:3100 PDF_BASE=http://127.0.0.1:3100
          export REPORT_PDF_DIR="$RUNNER_TEMP/reports"; mkdir -p "$REPORT_PDF_DIR"
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public
          (cd .next/standalone && node server.js > "$GITHUB_WORKSPACE/pca-platform/$OUT/logs/server.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/api/health >/dev/null && break; sleep 1; done
          curl -s -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:3100/api/health
          BASE=http://127.0.0.1:3100 OUT="$SHOTS" node scripts/sejong/e2e-shots.mjs > "$OUT/e2e.log" 2>&1
          rc=$?; cat "$OUT/e2e.log"
          printf 'browser e2e (구직자·상담사·관리자·PDF)\t%s\n' $rc >> "$OUT/steps.tsv"
          grep -n "sejong-pdf" "$OUT/logs/server.log" | head -20 || true
          ls -la "$SHOTS" | head -40

      - name: 결과 한 장
        if: always()
        run: |
          node scripts/sejong/ci-summary.mjs "$OUT" > /dev/null || true
          cat "$OUT/RESULT.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 글로 된 결과만 올린다 (캡처·PDF 제외)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sejong-verify-text
          path: |
            pca-platform/var/sejong-ci/*.md
            pca-platform/var/sejong-ci/*.tsv
            pca-platform/var/sejong-ci/*.log
            pca-platform/var/sejong-ci/*.txt
            pca-platform/var/sejong-ci/logs/
          retention-days: 7

      - name: 캡처·PDF 는 잠가서만 (비밀값이 있을 때)
        if: always()
        env:
          KEY: ${{ secrets.SEJONG_ARTIFACT_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "SEJONG_ARTIFACT_KEY 없음 → 캡처·PDF 를 올리지 않는다"; exit 0; fi
          tar -C "$SHOTS" -czf "$RUNNER_TEMP/shots.tgz" .
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY \
            -in "$RUNNER_TEMP/shots.tgz" -out "$RUNNER_TEMP/sejong-shots.tgz.enc"
          rm -f "$RUNNER_TEMP/shots.tgz"
          echo "ENC=1" >> "$GITHUB_ENV"

      - name: 잠근 파일 올리기
        if: always() && env.ENC == '1'
        uses: actions/upload-artifact@v4
        with:
          name: sejong-shots-encrypted
          path: ${{ runner.temp }}/sejong-shots.tgz.enc
          retention-days: 3

      - name: 판정 (한 단계라도 걸리면 빨강)
        if: always()
        run: |
          cat "$OUT/steps.tsv"
          ! awk -F'\t' '$2 != "0"' "$OUT/steps.tsv" | grep -q .

  # Staging 리허설: Railway 가 굽는 것과 같은 운영 Dockerfile 이미지를 그대로 띄우고,
  # STAGING_PLAN.md 의 차례(컨테이너 안 db:init → 세종 스키마 → 비밀 없는 시드)를
  # 컨테이너 안에서 밟은 뒤, Basic 인증 뒤의 그 서버를 실제 브라우저로 끝까지 누른다.
  # **이것은 Staging 접속이 아니다.** 러너 안에서만 뜨고 바깥 주소가 없다.
  staging-rehearsal:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sejong-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: sejong-rehearsal
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm-ci-only
          POSTGRES_DB: cm_stage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cm" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: pca-platform
        shell: bash --noprofile --norc {0}
    env:
      OUT: var/sejong-rehearsal
      DB: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_stage
      URL: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pca-platform/package-lock.json

      - name: 실행마다 새 비밀값 (로그에서 가린다)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client poppler-utils >/dev/null
          mkdir -p "$OUT/logs"; : > "$OUT/steps.tsv"
          for k in SJ_PW_ADMIN SJ_PW_COUNSEL SJ_PW_SEEKER SJ_PW_VIRTUAL AUTH_SECRET GATE_PW; do
            v="$(openssl rand -base64 24 | tr -d '/+=')"; echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"
          done

      - name: 운영 Dockerfile 로 이미지 굽기 (Railway 와 같은 빌드)
        run: |
          docker build -t sejong-staging:rehearsal . > "$OUT/logs/docker-build.log" 2>&1; rc=$?
          tail -25 "$OUT/logs/docker-build.log"
          printf 'docker build (운영 Dockerfile)\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: 컨테이너 띄우기 (APP_ENV=staging · Basic 인증 · 내부 DB)
        run: |
          docker run -d --name sj --network host \
            -e DATABASE_URL="$DB" -e AUTH_SECRET -e APP_ENV=staging -e PORT=3200 \
            -e STAGING_BASIC_AUTH="qa:$GATE_PW" -e PLATFORM_URL="$URL" -e PDF_BASE="$URL" \
            -e DB_IS_PERSISTENT=yes sejong-staging:rehearsal
          for i in $(seq 1 90); do curl -sf "$URL/api/health" >/dev/null && break; sleep 2; done
          c=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health"); echo "health $c"
          printf 'container up · /api/health %s\t%s\n' "$c" $([ "$c" = 200 ] && echo 0 || echo 1) >> "$OUT/steps.tsv"

      - name: STAGING_PLAN 6번 — 컨테이너 안에서 DB 세우기
        run: |
          rc=0
          docker exec -w /app sj npm run -s db:init > "$OUT/logs/db-init.log" 2>&1 || rc=1
          docker exec -w /app sj psql "$DB" -q -v ON_ERROR_STOP=1 -f db/sejong/schema_sejong_demo.sql >> "$OUT/logs/db-init.log" 2>&1 || rc=1
          docker exec -w /app sj psql "$DB" -q -v ON_ERROR_STOP=1 --single-transaction \
            -v pw_admin="$SJ_PW_ADMIN" -v pw_counsel="$SJ_PW_COUNSEL" \
            -v pw_seeker="$SJ_PW_SEEKER" -v pw_virtual="$SJ_PW_VIRTUAL" \
            -f db/sejong/seed_sejong_demo.sql >> "$OUT/logs/db-init.log" 2>&1 || rc=1
          n=$(psql "$DB" -tAc "SELECT count(*) FROM sj_participants")
          echo "participants $n"; tail -5 "$OUT/logs/db-init.log"
          [ "$n" = 21 ] || rc=1
          printf 'in-container db:init · 세종 스키마 · 시드 (참여자 %s)\t%s\n' "$n" $rc >> "$OUT/steps.tsv"

      - name: 시드 안전장치 — 비밀번호 변수 없이 · 실사용자 있는 DB
        run: |
          rc=0
          out=$(docker exec -w /app sj psql "$DB" -v ON_ERROR_STOP=1 -f db/sejong/seed_sejong_demo.sql 2>&1)
          echo "$out" | grep -q "을 -v 로 주십시오" || rc=1
          psql "$DB" -qc "CREATE DATABASE cm_real"
          R=postgres://cm:cm-ci-only@127.0.0.1:5432/cm_real
          docker exec -w /app sj sh -c "DATABASE_URL=$R npm run -s db:init" > /dev/null 2>&1
          psql "$R" -qc "INSERT INTO users (login_id, display_name, is_demo, password_hash) VALUES ('real', 'r', false, 'x')"
          docker exec -w /app sj psql "$R" -q -f db/sejong/schema_sejong_demo.sql > /dev/null 2>&1
          docker exec -w /app sj psql "$R" -v ON_ERROR_STOP=1 -v pw_admin=a -v pw_counsel=b -v pw_seeker=c -v pw_virtual=d \
            -f db/sejong/seed_sejong_demo.sql 2>&1 | grep -q "시연이 아닌 사용자가 있는 DB" || rc=1
          [ "$(psql "$R" -tAc 'SELECT count(*) FROM sj_participants')" = 0 ] || rc=1
          printf 'seed guards (변수 없음 · 실사용자 DB)\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: 접근 제한 — Basic 인증 · noindex · 헬스만 열림
        run: |
          rc=0
          a=$(curl -s -o /dev/null -w '%{http_code}' "$URL/sejong"); echo "no-auth /sejong $a"; [ "$a" = 401 ] || rc=1
          b=$(curl -s -o /dev/null -w '%{http_code}' -u "qa:$GATE_PW" "$URL/sejong"); echo "auth /sejong $b"; [ "$b" = 200 ] || rc=1
          curl -sI -u "qa:$GATE_PW" "$URL/sejong" | grep -qi '^x-robots-tag:.*noindex' || { echo "noindex 없음"; rc=1; }
          h=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health"); [ "$h" = 200 ] || rc=1
          printf 'access gate (401 · 200 · noindex)\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: npm ci (E2E 도구만)
        run: npm ci --no-audit --no-fund > /dev/null && npx playwright install --with-deps chromium > /dev/null

      - name: 컨테이너에 대고 브라우저 E2E (구직자 · 상담사 · 관리자 · PDF)
        run: |
          STAGING_BASIC_AUTH="qa:$GATE_PW" BASE="$URL" DATABASE_URL="$DB" OUT="$OUT/shots" \
            node scripts/sejong/e2e-shots.mjs > "$OUT/e2e.log" 2>&1; rc=$?
          cat "$OUT/e2e.log"
          printf 'browser e2e on container\t%s\n' $rc >> "$OUT/steps.tsv"
          docker logs sj 2>&1 | grep -n "sejong-pdf\|Error" | head -20 || true

      - name: 결과 (글만)
        if: always()
        run: |
          docker logs sj > "$OUT/logs/container.log" 2>&1 || true
          { echo "## Staging 리허설 (운영 이미지)"; echo; echo '| 단계 | 종료코드 |'; echo '|---|---|';
            awk -F'\t' '{print "| " $1 " | " $2 " |"}' "$OUT/steps.tsv"; echo;
            grep -E "통과 · .* 걸림" "$OUT/e2e.log" || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: 글로 된 결과만 올린다
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sejong-rehearsal-text
          path: |
            pca-platform/var/sejong-rehearsal/*.tsv
            pca-platform/var/sejong-rehearsal/*.log
            pca-platform/var/sejong-rehearsal/logs/
          retention-days: 7

      - name: 판정
        if: always()
        run: |
          cat "$OUT/steps.tsv"
          ! awk -F'\t' '$2 != "0"' "$OUT/steps.tsv" | grep -q .
