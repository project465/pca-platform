# 세종 가지 전용 검증. **이 가지에 푸시될 때만** 돈다(다른 가지·운영과 무관).
#
# 세종 세션의 작업 환경은 npm 레지스트리가 막혀 있어 `npm ci` · `next build` ·
# 브라우저 E2E 를 직접 돌릴 수 없다. 그래서 같은 일을 GitHub 러너에서 한다:
#   npm ci → 전체 TypeScript 검사 → Next.js 실제 빌드
#   → 기존 측정·채점 회귀 (기준 0bff307c 와 HEAD 를 같은 환경에서 나란히)
#   → 세종 분석 23 → DB 스키마·접근 경계 → standalone 서버 → 브라우저 E2E · PDF
#   → 결과와 캡처를 이 가지의 docs/sejong/ 에 커밋해 돌려준다.
#
# 쓰는 것: 러너 안의 PostgreSQL 16(일회용) · 가상 참여자 시드 · CI 전용 AUTH_SECRET.
# 쓰지 않는 것: 운영·Staging DB, Railway, 실제 개인정보, 저장소 비밀값.
name: sejong-verify

on:
  push:
    branches: [claude/epic-galileo-lrvgxr]
    paths-ignore:
      - "pca-platform/docs/sejong/ci/**"
      - "pca-platform/docs/sejong/shots/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sejong-verify
  cancel-in-progress: true

env:
  BASE_SHA: 0bff307c41aac286549a9a85503e4a9af162ca9e
  OUT: docs/sejong/ci
  SHOTS: docs/sejong/shots

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm-ci-only
          POSTGRES_DB: cm_head
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cm" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: pca-platform
        shell: bash --noprofile --norc {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pca-platform/package-lock.json

      - name: 도구 (psql · pdftoppm · 한글 글꼴)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client poppler-utils fonts-noto-cjk >/dev/null
          mkdir -p "$OUT" "$SHOTS"
          printf 'sha\t%s\nbase\t%s\nrun_id\t%s\nrun_url\t%s\nat\t%s\nnode\t%s\n' \
            "$GITHUB_SHA" "$BASE_SHA" "$GITHUB_RUN_ID" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(date -u +%FT%TZ)" "$(node -v)" > "$OUT/meta.tsv"
          : > "$OUT/steps.tsv"

      - name: npm ci
        run: |
          npm ci --no-audit --no-fund; rc=$?
          printf 'npm ci\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: Next.js 실제 빌드
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build > "$OUT/build.log" 2>&1; rc=$?
          tail -40 "$OUT/build.log"
          printf 'next build\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: DB 두 벌 (HEAD · 기준) — 공통 체인
        env:
          PGPASSWORD: cm-ci-only
        run: |
          psql -h 127.0.0.1 -U cm -d cm_head -c "CREATE DATABASE cm_base" >/dev/null
          for db in cm_head cm_base; do
            node -e 'const c=require("./deploy/db-chain.json");for(const f of [...c.base,...c.upgrade])console.log(f)' \
              | while read f; do psql "postgres://cm:cm-ci-only@127.0.0.1:5432/$db" -q -v ON_ERROR_STOP=1 --single-transaction -f "$f"; done
          done
          printf 'db chain\t0\n' >> "$OUT/steps.tsv"

      - name: 회귀 — 세종 HEAD
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_head
        run: bash scripts/sejong/ci-regression.sh . "$OUT/head.tsv"

      - name: 회귀 — 기준 0bff307c
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_base
        run: |
          git worktree add -q ../../base "$BASE_SHA"
          ln -s "$PWD/node_modules" ../../base/pca-platform/node_modules
          bash scripts/sejong/ci-regression.sh ../../base/pca-platform "$PWD/$OUT/base.tsv"

      - name: 세종 분석 23
        run: |
          node --experimental-strip-types --no-warnings scripts/sejong/analysis-check.mjs | tee "$OUT/analysis.log"
          printf 'sejong analysis 23\t%s\n' ${PIPESTATUS[0]} >> "$OUT/steps.tsv"

      - name: 세종 DB 층 · 시드 · 접근 경계
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_head
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f db/sejong/schema_sejong_demo.sql
          node --experimental-strip-types --no-warnings scripts/sejong/seed-demo.mjs > /tmp/sj-seed.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 --single-transaction -f /tmp/sj-seed.sql
          node scripts/sejong/db-check.mjs | tee "$OUT/db-check.log"
          printf 'sejong db-check\t%s\n' ${PIPESTATUS[0]} >> "$OUT/steps.tsv"

      - name: 공통 파일 무변경 확인
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- . \
            ':!docs/sejong' ':!db/sejong' ':!src/sejong' ':!src/app/sejong' ':!scripts/sejong' > "$OUT/shared-diff.txt"
          n=$(wc -l < "$OUT/shared-diff.txt"); cat "$OUT/shared-diff.txt"
          printf 'shared files changed = %s\t%s\n' "$n" $([ "$n" = 0 ] && echo 0 || echo 1) >> "$OUT/steps.tsv"

      - name: 브라우저 (빌드에 쓰인 playwright 와 같은 판)
        run: npx playwright install --with-deps chromium > /dev/null

      - name: standalone 서버 → 브라우저 E2E · PDF
        env:
          DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_head
        run: |
          export AUTH_SECRET="$(openssl rand -base64 32)"
          export APP_ENV=staging PORT=3100 HOSTNAME=127.0.0.1
          export PLATFORM_URL=http://127.0.0.1:3100 PDF_BASE=http://127.0.0.1:3100
          export REPORT_PDF_DIR="$PWD/var/reports"; mkdir -p "$REPORT_PDF_DIR"
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public
          (cd .next/standalone && node server.js > "$GITHUB_WORKSPACE/pca-platform/$OUT/server.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/api/health >/dev/null && break; sleep 1; done
          curl -s -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:3100/api/health
          BASE=http://127.0.0.1:3100 OUT="$SHOTS" node scripts/sejong/e2e-shots.mjs 2>&1 | tee "$OUT/e2e.log"
          printf 'browser e2e\t%s\n' ${PIPESTATUS[0]} >> "$OUT/steps.tsv"
          grep -n "sejong-pdf\|Error" "$OUT/server.log" | head -40 || true

      - name: 결과 한 장
        if: always()
        run: |
          node scripts/sejong/ci-summary.mjs "$OUT" > /dev/null || true
          cat "$OUT/RESULT.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: 산출물 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sejong-verify
          path: |
            pca-platform/docs/sejong/ci
            pca-platform/docs/sejong/shots
          retention-days: 30

      - name: 결과를 이 가지에 돌려주기
        if: always()
        run: |
          git config user.name "sejong-verify[bot]"
          git config user.email "sejong-verify@users.noreply.github.com"
          git add -f "$OUT" "$SHOTS"
          git diff --cached --quiet && exit 0
          git commit -q -m "세종 CI 검증 결과 · 캡처 (${GITHUB_SHA::8}) [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*4)); done
          exit 1

      - name: 판정 (한 단계라도 걸리면 빨강)
        if: always()
        run: |
          cat "$OUT/steps.tsv"
          ! awk -F'\t' '$2 != "0"' "$OUT/steps.tsv" | grep -q .
