# KUS(고려대학교 세종캠퍼스) 가지 전용 검증. 이 세션은 npm 레지스트리가 막혀 `npm ci` ·
# `next build` · 실제 Next 브라우저 E2E 를 직접 못 돌린다. 같은 일을 GitHub 러너에서 한다.
#
# 보안(세종 가지와 같은 규칙)
# - GITHUB_TOKEN 은 `contents: read` 만. 저장소에 아무것도 커밋·푸시하지 않는다.
# - 러너 안 일회용 PostgreSQL 과 `[테스트]` 시드뿐이다. 운영·Staging DB · Railway ·
#   실제 개인정보 · 저장소 비밀값을 쓰지 않는다. 비밀번호는 실행마다 무작위로 만들고 가린다.
# - 공개 저장소의 artifact 는 누구나 받을 수 있다. **글로 된 결과만** 올리고 화면 캡처 ·
#   PDF 는 올리지 않는다.
#
# 언제 도는가: 손으로(workflow_dispatch), 또는 커밋 메시지에 `[kus-verify]` 가 있는 이
# 가지의 푸시만.
name: kus-verify

on:
  workflow_dispatch:
  push:
    branches: [claude/ecstatic-cori-sv6lh5]

permissions:
  contents: read

env:
  # 기준 커밋(R35). 공통 파일 무변경을 이 커밋과 견준다
  BASE_SHA: 4f02d79b072123848975cf997974aab9ce2b1fdf
  OUT: var/kus-ci

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kus-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    concurrency:
      group: kus-verify
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm-ci-only
          POSTGRES_DB: cm_kus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cm" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: pca-platform
        shell: bash --noprofile --norc {0}
    env:
      DATABASE_URL: postgres://cm:cm-ci-only@127.0.0.1:5432/cm_kus
      APP_ENV: staging
      V3_CAMPUS_FIXTURE: scripts/fixtures/campus-kus.json
      V3_PREVIEW_OPEN: CS_CORE_V1,EE_CORE_V1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pca-platform/package-lock.json

      - name: 도구 · 실행마다 새 비밀번호
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client poppler-utils fonts-noto-cjk >/dev/null
          mkdir -p "$OUT/logs"
          for k in KUS_PW KUS_ADMIN_PW AUTH_SECRET; do
            v="$(openssl rand -base64 24 | tr -d '/+=')"; echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"
          done
          : > "$OUT/steps.tsv"

      - name: npm ci
        run: |
          npm ci --no-audit --no-fund; rc=$?
          printf 'npm ci\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: TypeScript 전체 검사
        run: |
          npm run -s typecheck > "$OUT/logs/typecheck.log" 2>&1; rc=$?
          grep -n "src/app/kus\|src/lib/kus\|scripts/kus" "$OUT/logs/typecheck.log" | head -60
          tail -20 "$OUT/logs/typecheck.log"
          printf 'typecheck\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: Next.js 빌드
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build > "$OUT/logs/build.log" 2>&1; rc=$?
          grep -n "kus" "$OUT/logs/build.log" | head -40
          tail -40 "$OUT/logs/build.log"
          printf 'next build\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      - name: DB — 공통 체인 + KUS 표
        run: |
          rc=0
          for f in $(node -e 'const c=require("./deploy/db-chain.json");for(const f of [...c.base,...c.upgrade])console.log(f)'); do
            psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 --single-transaction -f "$f" >> "$OUT/logs/db.log" 2>&1 || { echo "실패: $f"; rc=1; }
          done
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f db/kus/schema_kus.sql >> "$OUT/logs/db.log" 2>&1 || rc=1
          printf 'db chain + kus schema\t%s\n' $rc >> "$OUT/steps.tsv"; exit $rc

      # 공통 회귀는 **운영과 같은 조건**으로 돈다: 미리보기 문(V3_PREVIEW_OPEN)을 열어 두면
      # `campus:check` 가 `닫아 둔 Core 가 검사 가능으로 서지 않는다` 를 바르게 걸어 버린다.
      - name: 공통 회귀(측정 동결 · 등록부 · 체인)
        run: |
          for s in v3:freeze:measure campus:check db:chain; do
            f="$OUT/logs/$(echo "$s" | tr ':' '_').log"
            env -u V3_PREVIEW_OPEN -u V3_CAMPUS_FIXTURE npm run -s "$s" > "$f" 2>&1; rc=$?
            tail -4 "$f"; grep -E "걸림 [1-9]|  걸림 " "$f" | head -10 || true
            printf '%s\t%s\n' "$s" $rc >> "$OUT/steps.tsv"
          done

      - name: 브라우저
        run: npx playwright install --with-deps chromium > /dev/null

      - name: KUS 서버 쪽 E2E (RICH · POOR · CONTRA · 격리 · PDF)
        run: |
          APPLY=yes OUT="$OUT/qa" APP_ENV=dev npx tsx scripts/kus/verify.ts > "$OUT/logs/kus-verify.log" 2>&1; rc=$?
          cat "$OUT/logs/kus-verify.log"
          for f in "$OUT"/qa/pdf/*.pdf; do echo "$f $(pdfinfo "$f" | grep Pages)"; done
          printf 'kus server e2e\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: 시드(테스트 계정 비밀번호)
        run: APPLY=yes APP_ENV=dev KUS_STUDENT_PW="$KUS_PW" npx tsx scripts/kus/demo-setup.ts

      - name: 실제 Next 서버 → 브라우저 E2E
        run: |
          (bash scripts/stage-serve.sh 3100 > "$GITHUB_WORKSPACE/pca-platform/$OUT/logs/server.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/api/health >/dev/null && break; sleep 1; done
          curl -s -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:3100/api/health
          BASE=http://127.0.0.1:3100 npx tsx scripts/kus/e2e-next.ts > "$OUT/logs/kus-e2e-next.log" 2>&1; rc=$?
          cat "$OUT/logs/kus-e2e-next.log"
          grep -n "kus-pdf\|Error" "$OUT/logs/server.log" | head -30 || true
          printf 'kus next browser e2e\t%s\n' $rc >> "$OUT/steps.tsv"

      - name: 공통 파일 무변경 확인
        run: |
          git diff --name-only "$BASE_SHA" HEAD -- . \
            ':!docs/kus' ':!db/kus' ':!src/lib/kus' ':!src/app/kus' ':!scripts/kus' ':!scripts/fixtures/campus-kus.json' \
            ':!scripts/lab/offline' > "$OUT/shared-diff.txt"
          cat "$OUT/shared-diff.txt"
          n=$(wc -l < "$OUT/shared-diff.txt")
          printf 'shared files changed = %s\t%s\n' "$n" $([ "$n" = 0 ] && echo 0 || echo 1) >> "$OUT/steps.tsv"

      - name: 결과 한 장
        if: always()
        run: |
          { echo "## KUS verify"; echo; echo '| 단계 | 종료코드 |'; echo '|---|---|';
            awk -F'\t' '{print "| " $1 " | " $2 " |"}' "$OUT/steps.tsv"; echo;
            grep -hE "PASS [0-9]+ · FAIL" "$OUT"/logs/kus-*.log || true; } | tee "$OUT/RESULT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 글로 된 결과만 올린다
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kus-verify-text
          path: |
            pca-platform/var/kus-ci/*.md
            pca-platform/var/kus-ci/*.tsv
            pca-platform/var/kus-ci/*.txt
            pca-platform/var/kus-ci/logs/
          retention-days: 7

      - name: 판정
        if: always()
        run: |
          cat "$OUT/steps.tsv"
          ! awk -F'\t' '$2 != "0"' "$OUT/steps.tsv" | grep -q .
