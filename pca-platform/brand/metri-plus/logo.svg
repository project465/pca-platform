<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -16 652 212" width="652" height="212"
     role="img" aria-label="METRI PLUS">
  <title>METRI PLUS</title>
  <!--
    메트리 플러스 로고.

    · 워드마크는 METRI 와 같은 딥네이비(#0F1B2D)다. 같은 집안임을 색이 말한다.
      글자는 획을 굵게 세우고 끝을 둥글려, 대학용 METRI 의 각진 육각형과
      한눈에 갈리게 했다. 쓰는 사람이 중·고등학생이다.
    · 호(弧)는 중2에서 시작해 대학까지 이어지는 궤적이다. 이 제품이 재는 것이
      한 시점의 점수가 아니라 이어지는 경로라서, 선 하나가 그것을 그린다.
      글자를 가로지르지 않는다 · 가로지르면 선이 토막나 읽히지 않는다.
    · 호가 도착하는 곳에 플러스 블록이 있다. 호는 블록 뒤로 들어가 끝난다.

    색은 CSS 변수로 열어 뒀다. 어두운 바탕에는 logo-dark.svg 를 쓰거나
    logo-ink / logo-amber 를 덮어쓰면 된다.
  -->
  <style>
    .wm  { stroke: var(--logo-ink,   #0F1B2D); stroke-width: 28; }
    .arc { stroke: var(--logo-amber, #E07B39); stroke-width: 22; }
    .wm, .arc { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <path class="arc" d="M-8,160 C120,170 250,166 352,148 C410,138 478,118 536,86"/>

  <g class="wm">
    <path d="M14,106 L14,14 L48,74 L82,14 L82,106"/>
    <path d="M174,14 L126,14 L126,106 L174,106 M126,60 L166,60"/>
    <path d="M218,14 L274,14 M246,14 L246,106"/>
    <path d="M318,106 L318,14 L350,14 A23,23 0 0 1 350,60 L318,60 M348,60 L376,106"/>
    <path d="M418,14 L418,106"/>
  </g>

  <rect x="478" y="0" width="120" height="120" rx="30" fill="var(--logo-amber, #E07B39)"/>
  <path d="M538,32 L538,88 M510,60 L566,60" fill="none" stroke="var(--logo-paper, #FFFFFF)"
        stroke-width="22" stroke-linecap="round"/>
</svg>
