<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -16 1126 212" width="1126" height="212"
     role="img" aria-label="Careermetri Plus">
  <title>Careermetri Plus</title>
  <!--
    커리어메트리 플러스 로고. (2026-09-16 — 이름이 바뀌어 워드마크를 다시 그렸다)

    · 획은 글자높이의 22% 다. 28 로 두면 열한 글자에서 A·R·E 의 속공간이
      막혀 덩어리로 읽힌다 — 다섯 글자일 때와 같은 굵기를 쓸 수 없었다.
    · 글자는 텍스트가 아니라 획이다. 폰트가 없는 자리에서도 같은 모양으로
      선다 — 인쇄물과 학교 공문에 그대로 얹히기 때문이다.
    · 딥네이비(#0F1B2D)는 대학판 Careermetri 와 같다. 같은 집안임을 색이
      말한다. 획을 굵게 세우고 끝을 둥글려, 대학판의 각진 육각형과 한눈에
      갈리게 했다. 쓰는 사람이 중·고등학생이다.
    · 호(弧)는 중2에서 시작해 대학까지 이어지는 궤적이다. 이 제품이 재는
      것이 한 시점의 점수가 아니라 이어지는 경로라서, 선 하나가 그것을
      그린다. 글자를 가로지르지 않는다 — 가로지르면 선이 토막나 읽히지
      않는다.
    · 호가 도착하는 곳에 플러스 블록이 있다. 호는 블록 뒤로 들어가 끝난다.

    글자가 다섯에서 열하나로 늘어 가로가 길어졌다. 작게 쓸 자리에는
    mark.svg(글자 없는 아이콘)를 쓴다.
  -->
  <style>
    .wm-d  { stroke: var(--logo-ink,   #FFFFFF); stroke-width: 20; }
    .arc-d { stroke: var(--logo-amber, #F09246); stroke-width: 18; }
    .wm-d, .arc-d { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <path class="arc-d" d="M-8,166 C260,180 600,174 880,152 C940,146 985,120 1012,86"/>

