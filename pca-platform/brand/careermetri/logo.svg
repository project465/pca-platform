<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -10 926 172" width="926" height="172"
     role="img" aria-label="커리어메트리">
  <title>커리어메트리</title>
  <!--
    커리어메트리 워드마크 (대학 공학계열 직무적합 진단).

    · 글자는 플러스 로고와 같은 획을 쓴다. 같은 집안임을 글자가 말한다.
    · 갈리는 곳은 마감과 색이다. 플러스는 끝을 둥글리고 앰버를 쓰고,
      이쪽은 끝을 각지게 자르고 금색을 쓴다. 읽는 사람이 다르다.
      한쪽은 중·고등학생, 이쪽은 대학 담당자다.
    · 마감은 butt 다. square 로 두면 획 끝이 10 씩 늘어나 A 의 가로획이
      다리 밖으로 삐져나오고 글자마다 폭이 부푼다.
    · miterlimit 은 2 다. A 와 M 의 꼭짓점은 각이 좁아 마이터가 글자높이의
      3분의 1 만큼 위로 솟는다. 2 로 걸면 그 둘만 평평하게 잘리고 E·T·I 의
      직각(비 1.41)은 날카롭게 남는다.
    · R 의 다리는 그릇 끝(60)이 아니라 잉크 안쪽(196,60)에서 출발한다.
      끝에서 시작하면 이음새에 흰 쐐기가 남는다.
    · 금색 막대는 장식이 아니라 사이트에서 이미 쓰는 부호다. 홈페이지의
      모든 절 제목 아래에 같은 막대가 있다. 로고와 화면이 같은 말을 한다.
    · 획은 글자높이의 22%(20/92). 더 굵히면 A·R·E 의 속공간이 막혀
      열한 글자가 덩어리로 읽힌다.
    · T 부터 오른쪽(T·R·I)을 6~16 씩 당겼다. T 는 아래가 비어 있어 같은
      간격이어도 좌우가 벌어져 보이고, 그대로 두면 CAREERME 와 TRI 로
      끊겨 읽힌다. 자간은 재는 값이 아니라 보이는 값으로 맞춘다.
    · 글자를 텍스트가 아니라 획으로 둔 이유: 폰트가 없는 자리에서도 같은
      모양으로 선다. 학교 공문과 인쇄물에 그대로 얹힌다.

    색을 바꾸려면 CSS 변수 logo-ink 와 logo-gold 를 준다. 어두운 바탕에는
    logo-dark.svg 를 쓴다.
  -->
  <style>
    .wm { stroke: var(--logo-ink, #0F1B2D); stroke-width: 20;
          fill: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 2; }
  </style>

  <g class="wm">
    <path d="M52,34 C44,20 34,14 24,14 C10,14 0,34 0,60 C0,86 10,106 24,106 C34,106 44,100 52,86"/>
    <path d="M86,106 L116,14 L146,106 M97,74 L135,74"/>
    <path d="M180,106 L180,14 L212,14 A23,23 0 0 1 212,60 L180,60 M196,60 L238,106"/>
    <path d="M320,14 L272,14 L272,106 L320,106 M272,60 L312,60"/>
    <path d="M402,14 L354,14 L354,106 L402,106 M354,60 L394,60"/>
    <path d="M436,106 L436,14 L468,14 A23,23 0 0 1 468,60 L436,60 M452,60 L494,106"/>
    <path d="M528,106 L528,14 L562,74 L596,14 L596,106"/>
    <path d="M678,14 L630,14 L630,106 L678,106 M630,60 L670,60"/>
    <path d="M706,14 L762,14 M734,14 L734,106"/>
    <path d="M790,106 L790,14 L822,14 A23,23 0 0 1 822,60 L790,60 M806,60 L848,106"/>
    <path d="M878,14 L878,106"/>
  </g>

  <rect x="0" y="138" width="196" height="10" fill="var(--logo-gold, #C9A227)"/>
</svg>
