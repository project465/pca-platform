<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="커리어메트리">
  <title>커리어메트리</title>
  <!--
    작게 쓰는 자리용. 파비콘, 앱 아이콘, 프로필 사진.
    워드마크의 M 을 그대로 떼어 왔다 — 같은 획이라 나란히 놓아도 어긋나지
    않는다. 네모는 각지다. 플러스의 둥근 네모와 여기서 갈린다.
  -->
  <rect width="120" height="120" fill="#0F1B2D"/>
  <rect x="0" y="104" width="46" height="8" fill="#C9A227"/>
  <g transform="translate(60 52) scale(0.62) translate(-562 -60)">
    <path d="M528,106 L528,14 L562,74 L596,14 L596,106"
          fill="none" stroke="#E8EDF2" stroke-width="20"
          stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2"/>
  </g>
</svg>
