<title>METRI 공학 커리어 엔진</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* 결과지 — mockups/*.html 토큰 그대로 */
  --paper:#FFFFFF; --ink:#16232E; --rule:#C9D2D8; --muted:#61717D;
  --met:#1B6B57; --partial:#C08A0B; --gap:#C0392B;
  --s1:#16232E; --s2:#3B4E5C; --s3:#61717D; --s4:#8D9AA4; --s5:#B9C3CA;
  --trackbg:#E4E9EC;
  /* 셸 — 어두운 바탕 + 금색 (플랫폼 정체성) */
  --shell:#101A21; --shell2:#17242D; --shell3:#1F3038;
  --gold:#C9A227; --gold-soft:#E8C766; --shell-ink:#DCE6EC; --shell-mute:#8CA0AC;
  --stage:#EBEEF0;               /* 결과지가 놓이는 바닥 */
  --stage-line:#D5DBE0;
  --shadow:0 1px 2px rgba(16,26,33,.06),0 8px 28px rgba(16,26,33,.10);
  --ff:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fm:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --stage:#0C1418; --stage-line:#22323A; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45); }
}
:root[data-theme="dark"]{ --stage:#0C1418; --stage-line:#22323A; --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45); }

*{box-sizing:border-box}
body{
  margin:0; background:var(--stage); color:var(--ink);
  font-family:var(--ff); font-size:16px; line-height:1.62;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---------- 레이아웃 ---------- */
.wrap{display:grid; grid-template-columns:264px 1fr; min-height:100vh}
.rail{background:var(--shell); color:var(--shell-ink); padding:22px 16px 40px; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{display:flex; align-items:baseline; gap:8px; padding:0 8px 4px}
.brand b{font-size:17px; font-weight:700; letter-spacing:-.02em}
.brand span{font-family:var(--fm); font-size:11px; color:var(--gold); letter-spacing:.08em}
.brand-sub{padding:0 8px; font-size:12.5px; color:var(--shell-mute); margin-bottom:20px}
.navgrp{font-family:var(--fm); font-size:10.5px; letter-spacing:.14em; color:var(--shell-mute);
  padding:16px 8px 7px; text-transform:uppercase}
.rail button{
  display:flex; width:100%; align-items:center; gap:10px; text-align:left;
  background:none; border:0; color:var(--shell-ink); font:inherit; font-size:14.5px;
  padding:8px 8px; border-radius:5px; cursor:pointer; line-height:1.35;
}
.rail button:hover{background:var(--shell2)}
.rail button[aria-current="true"]{background:var(--shell3); color:#fff; box-shadow:inset 2px 0 0 var(--gold)}
.rail button i{font-family:var(--fm); font-style:normal; font-size:11px; color:var(--gold); min-width:20px}
.railfoot{margin-top:26px; padding:14px 8px 0; border-top:1px solid var(--shell3);
  font-size:11.5px; color:var(--shell-mute); line-height:1.55}

.stage{padding:26px 24px 88px; min-width:0}
.screen{display:none}
.screen.on{display:block}

/* ---------- 시트 ---------- */
.sheet{max-width:940px; margin:0 auto 22px; background:var(--paper); border:1px solid var(--rule); box-shadow:var(--shadow)}
.sheet-top{display:flex; flex-wrap:wrap; gap:8px 24px; align-items:baseline; padding:20px 34px; border-bottom:2px solid var(--ink)}
.sheet-top h1{font-size:15.5px; font-weight:700; letter-spacing:-.015em; margin:0}
.sheet-top .meta{margin-left:auto; display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--muted); font-size:13px}
section.blk{padding:30px 34px; border-bottom:1px solid var(--rule)}
section.blk:last-child{border-bottom:0}
h2.blk{font-size:13px; font-weight:600; color:var(--muted); margin:0 0 20px; letter-spacing:.01em}
h3{font-size:16px; font-weight:700; letter-spacing:-.015em; margin:0}
p{margin:0 0 12px; max-width:66ch}
p:last-child{margin-bottom:0}
.note{font-size:13.5px; color:var(--muted); max-width:64ch}
.foot{padding:16px 34px; background:#F6F8F9; color:var(--muted); font-size:12.5px; border-top:1px solid var(--rule)}

/* 게이지 */
.gauge{display:grid; grid-template-columns:minmax(120px,190px) 1fr 92px; gap:0 14px; align-items:center; padding:10px 0}
.gauge+.gauge{border-top:1px dotted var(--rule)}
.gauge .lab{font-size:14.5px; font-weight:500}
.gauge .lab small{display:block; font-size:11.5px; color:var(--muted); font-weight:400; font-family:var(--fm)}
.bar{height:14px; background:var(--trackbg); position:relative; border-radius:0 4px 4px 0}
.bar i{position:absolute; left:0; top:0; bottom:0; border-radius:0 4px 4px 0; background:var(--s2)}
.bar i.hi{background:var(--met)} .bar i.mid{background:var(--partial)} .bar i.lo{background:var(--gap)}
.bar i.ink{background:var(--s1)}
.gauge .val{text-align:right; font-family:var(--fm); font-size:14.5px; font-weight:600}
.gauge .val em{display:block; font-style:normal; font-weight:400; font-size:11.5px; color:var(--muted); font-family:var(--ff)}

/* 순위 band */
.band{display:flex; height:56px; margin-bottom:10px; gap:2px}
.band div{display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600; min-width:0; overflow:hidden}
.bandkey{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--muted)}
.bandkey span{display:flex; align-items:center; gap:6px}
.dot{width:10px; height:10px; border-radius:2px; flex:none}

/* 표 */
.tw{overflow-x:auto; margin:0 -2px}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:420px}
th,td{text-align:left; padding:8px 12px 8px 0; border-bottom:1px solid var(--rule); vertical-align:top}
th{font-size:11.5px; font-weight:600; color:var(--muted); font-family:var(--fm); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
td.num,th.num{text-align:right; font-family:var(--fm); white-space:nowrap}
code{font-family:var(--fm); font-size:12.5px; color:var(--muted)}

/* 칩·배지 */
.chip{display:inline-block; font-family:var(--fm); font-size:11px; font-weight:500; padding:2px 7px; border:1px solid var(--rule); color:var(--muted); border-radius:3px; white-space:nowrap}
.chip.req{border-color:var(--gap); color:var(--gap)}
.chip.ok{border-color:var(--met); color:var(--met)}
.chip.warn{border-color:var(--partial); color:var(--partial)}
.stars{font-family:var(--fm); color:var(--gold); letter-spacing:-1px}

/* 큰 수 */
.lead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.lead .name{font-size:34px; font-weight:700; letter-spacing:-.035em; line-height:1.12}
.lead .score{font-family:var(--fm); font-size:32px; font-weight:300; color:var(--muted); letter-spacing:-.03em}
.lead .score b{font-weight:600; color:var(--ink)}

/* 계산 내역 */
details.calc{border:1px solid var(--rule); margin-top:16px; background:#FAFBFC}
details.calc summary{cursor:pointer; padding:9px 14px; font-size:13.5px; font-weight:600; list-style:none}
details.calc summary::-webkit-details-marker{display:none}
details.calc summary::before{content:"▸ "; color:var(--gold)}
details.calc[open] summary::before{content:"▾ "}
details.calc .body{padding:4px 14px 14px; font-family:var(--fm); font-size:13px}
.calcrow{display:flex; justify-content:space-between; gap:14px; padding:3px 0; border-bottom:1px dotted var(--rule)}
.calcrow.total{border-bottom:0; border-top:1px solid var(--ink); font-weight:600; margin-top:4px; padding-top:6px}

/* 잠금 (B2C) */
.lock{position:relative; padding:12px 14px; border:1px dashed var(--rule); margin-bottom:8px; display:flex; justify-content:space-between; gap:12px; align-items:center; color:var(--muted); font-size:14px}
.lock b{color:var(--ink); font-weight:600}
.buy{display:inline-block; background:var(--ink); color:#fff; border:0; font:inherit; font-weight:600; font-size:15px; padding:11px 22px; cursor:pointer; border-radius:3px}
.buy.ghost{background:none; color:var(--ink); border:1px solid var(--ink)}

/* 문항 */
.qcard{border:1px solid var(--rule); padding:22px 24px}
.qnum{font-family:var(--fm); font-size:11.5px; color:var(--gold); letter-spacing:.1em}
.qtext{font-size:20px; font-weight:600; letter-spacing:-.02em; margin:6px 0 20px; max-width:34ch}
.likert{display:flex; gap:8px; flex-wrap:wrap}
.likert button{flex:1 1 90px; background:#fff; border:1px solid var(--rule); font:inherit; font-size:13.5px; padding:12px 6px; cursor:pointer; border-radius:3px; line-height:1.3}
.likert button:hover{border-color:var(--ink)}
.likert button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.prog{height:3px; background:var(--trackbg); margin-bottom:18px}
.prog i{display:block; height:100%; background:var(--gold)}

/* 대시보드 흐름 */
.flowstep{display:grid; grid-template-columns:34px 1fr; gap:0 16px}
.flowstep .n{font-family:var(--fm); font-size:12px; color:#fff; background:var(--s1); width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%}
.alert{border-left:3px solid var(--partial); background:#FDF8EC; padding:12px 16px; font-size:14px; margin-top:16px}
.alert b{color:var(--partial)}
.alert.act{border-left-color:var(--met); background:#EFF6F3} .alert.act b{color:var(--met)}

/* 컨트롤 */
.controls{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end; margin-bottom:20px}
.field{display:flex; flex-direction:column; gap:4px}
.field label{font-family:var(--fm); font-size:10.5px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
select,input[type=range]{font:inherit; font-size:14px}
select{padding:7px 10px; border:1px solid var(--rule); background:#fff; color:var(--ink); border-radius:3px}
input[type=range]{width:150px; accent-color:var(--gold)}
.slider{display:grid; grid-template-columns:minmax(84px,110px) 1fr 52px; gap:0 12px; align-items:center; padding:5px 0}
.slider span{font-size:13.5px}
.slider output{font-family:var(--fm); font-size:13px; text-align:right; color:var(--muted)}

/* 개요 */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule)}
.kpi{background:var(--paper); padding:16px 18px}
.kpi b{display:block; font-family:var(--fm); font-size:26px; font-weight:600; letter-spacing:-.03em; line-height:1.15; overflow-wrap:anywhere}
.kpi b.word{font-family:var(--ff); font-size:20px; letter-spacing:-.02em}
.kpi span{font-size:12.5px; color:var(--muted)}
ul.tight{margin:0; padding-left:18px} ul.tight li{margin-bottom:6px; max-width:64ch}
.hint{font-size:12.5px; color:var(--muted); font-family:var(--fm)}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static; height:auto; padding:16px 16px 18px}
  .rail nav{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
  .navgrp{display:none}
  .rail button{width:auto; white-space:nowrap; flex:none; border:1px solid var(--shell3)}
  .railfoot{display:none}
  .stage{padding:18px 16px 60px}
  .sheet-top,section.blk,.foot{padding-left:20px; padding-right:20px}
  .gauge{grid-template-columns:1fr 66px; grid-template-areas:"lab lab" "bar val"; row-gap:6px; padding:12px 0}
  .gauge .lab{grid-area:lab} .gauge .bar,.gauge>.bar{grid-area:bar} .gauge .val{grid-area:val}
  .gauge .val em{display:inline; margin-left:6px}
  .slider{grid-template-columns:1fr 52px; grid-template-areas:"lab val" "rng rng"; row-gap:4px}
  .slider span{grid-area:lab} .slider input{grid-area:rng; width:100%} .slider output{grid-area:val}
  .lead .name{font-size:27px} .lead .score{font-size:26px}
}
</style>

<aside class="rail">

}
function sheet(title, meta, inner, foot){
  meta = Array.isArray(meta) ? meta : (meta ? [meta] : []);

}
const RAMP = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];
function rankBand(rows){ // rows: [{label, n, share}] 크기순 — 순위 있는 크기라 단색 명도 램프를 쓴다
  const bars = rows.map((r,i)=>`<div style="width:${r.share}%;background:${RAMP[Math.min(i,4)]};color:${i>3?'var(--ink)':'#fff'}" title="${esc(r.label)} ${r.n}">${r.n}</div>`).join('');
  const key = rows.map((r,i)=>`<span><i class="dot" style="background:${RAMP[Math.min(i,4)]}"></i>${esc(r.label)} · ${r.share}%</span>`).join('');
  return `<div class="band">${bars}</div><div class="bandkey">${key}</div>`;
}

function scoreA(job, z){
  let a=0; for(const k in job.weights) a += job.weights[k]*(z[k]??0);
  return {a, A:sig(1.2*a)};
}
function scoreS(job, held){
  let num=0, den=0;
  job.requires.forEach(([c,r,k])=>{ num += k*Math.min(1,(held[c]??0)/r); den += k; });
  return den? num/den : 0;
}
function scoreP(job, pref){
  const keys=Object.keys(pref); if(!keys.length) return 0.5;
  const dot = keys.reduce((s,k)=> s + (job.industries.includes(k)?pref[k]:0), 0);
  const cos = dot / (Math.sqrt(keys.reduce((s,k)=>s+pref[k]*pref[k],0)) * Math.sqrt(job.industries.length));
  return 0.6*cos + 0.25 + 0.15;
}
function fitOf(job, z, held, pref, prof){
  const {A}=scoreA(job,z), S=scoreS(job,held), P=scoreP(job,pref), C=0.80;
  return {A,S,P,C, fit:100*(prof.wA*A+prof.wS*S+prof.wP*P+prof.wC*C)};
}

  return sheet('Skill Tree — 실제 시드 데이터', [m.ko, '역량 '+m.competencies.length+'개', '직무군 '+m.jobs.length+'개'],`

/* --- 산식 계산기 --- */
const calcZ = Object.assign({}, DEMO_Z);
const calcHeld = Object.assign({}, DEMO_HELD);
let calcJobCode = 'ME.CAE', calcTrack = 'UNIV_HIGH';
add('calc','데이터','매칭 산식 계산기', ()=>{
  const j = ME.jobs.find(x=>x.code===calcJobCode) || ME.jobs[1];
  const prof = D.scoringProfiles.find(p=>p.track===calcTrack) || PROF_UH;
  const {a,A} = scoreA(j, calcZ);
  const S = scoreS(j, calcHeld), P = scoreP(j, DEMO_PREF), C = 0.80;
  const fit = 100*(prof.wA*A + prof.wS*S + prof.wP*P + prof.wC*C);
  const axes = Object.keys(j.weights);
  return sheet('산식 계산기', ['슬라이더를 움직이면 점수가 다시 계산됩니다'],`
<section class="blk">
  <div class="controls">
    <div class="field"><label>직무</label><select id="calcJob">${ME.jobs.map(x=>`<option value="${x.code}" ${x.code===j.code?'selected':''}>${esc(x.ko)}</option>`).join('')}</select></div>
    <div class="field"><label>트랙 (가중치)</label><select id="calcTrack">${D.scoringProfiles.map(p=>`<option value="${p.track}" ${p.track===calcTrack?'selected':''}>${esc(p.track)} · ${esc(p.goal)}</option>`).join('')}</select></div>
  </div>
  <div class="lead">
    <div class="name">${fit.toFixed(1)}</div>
    <div class="score">${prof.display==='band' ? '구간 표시 트랙' : '점수 표시 트랙'}</div>
  </div>
  <p class="note">${prof.display==='band'
    ? '이 트랙은 증거가 적어 결과지에 <b>구간</b>으로만 나갑니다. 화면에는 숫자를 안 찍습니다.'
    : '증거가 쌓인 트랙이라 점수와 신뢰구간으로 나갑니다.'}</p>
  <details class="calc" open><summary>계산 내역</summary><div class="body">
    <div class="calcrow"><span>A 성향·활동 (a=${a.toFixed(3)} → σ(1.2a))</span><span>${A.toFixed(3)} × ${prof.wA} = ${(100*prof.wA*A).toFixed(1)}</span></div>
    <div class="calcrow"><span>S 역량 충족</span><span>${S.toFixed(3)} × ${prof.wS} = ${(100*prof.wS*S).toFixed(1)}</span></div>
    <div class="calcrow"><span>P 선호 일치</span><span>${P.toFixed(3)} × ${prof.wP} = ${(100*prof.wP*P).toFixed(1)}</span></div>
    <div class="calcrow"><span>C 이력 방향</span><span>${C.toFixed(3)} × ${prof.wC} = ${(100*prof.wC*C).toFixed(1)}</span></div>
    <div class="calcrow total"><span>Fit</span><span>${fit.toFixed(2)}</span></div>
  </div></details>
</section>
<section class="blk">
  <h2 class="blk">A — 검사 지표 (T 점수)</h2>
  ${axes.map(ax=>`<div class="slider">
    <span>${esc(axisKo[ax])} <span class="hint">w ${j.weights[ax].toFixed(2)}</span></span>
    <input type="range" id="z_${ax}" data-z="${ax}" min="20" max="80" step="1" value="${Math.round(50+calcZ[ax]*10)}">
    <output>T ${Math.round(50+calcZ[ax]*10)}</output>
  </div>`).join('')}
</section>
<section class="blk">
  <h2 class="blk">S — 보유 역량 수준</h2>
  ${j.requires.map(([c,r,k])=>`<div class="slider">
    <span>${esc(nm(c))} <span class="hint">요구 ${r} ${'★'.repeat(k)}</span></span>
    <input type="range" id="h_${c}" data-h="${c}" min="0" max="5" step="1" value="${calcHeld[c]??0}">
    <output>${calcHeld[c]??0} / ${r}</output>
  </div>`).join('')}
  <p class="note" style="margin-top:14px">보유 수준은 실제로는 슬라이더가 아니라 <b>증거</b>에서 계산됩니다 —
  과목 A+ 는 2.0×1.00×0.95, 자기보고는 1.5×0.60. 여기서는 산식이 어떻게 반응하는지 보려고 직접 움직이게 했습니다.</p>
</section>`,'점수는 이 산식이 만듭니다. LLM 은 이 값을 설명하는 문장만 씁니다.');
});

    <tr><td>직무 영역 10</td><td>경영·전략 … 컨설팅</td><td>기존 PCA</td><td>전 학과 공통 층</td></tr>
    <tr><td>전공 직무군 8</td><td>기계설계 · CAE …</td><td>METRI 신규</td><td>공학 특화 층</td></tr>
  </table></div>
  <p class="note" style="margin-top:14px"><b>기존 6축을 바꾸지 않습니다.</b> 바꾸면 이미 응시한 학생과 비교가 끊깁니다.

/* ================= 부팅 ================= */
const nav = document.getElementById('nav'), stage = document.getElementById('stage');
let cur = 'overview';
const groups = []; let navNo = 0;
SCREENS.forEach(s=>{ let g=groups.find(x=>x.name===s.group); if(!g){g={name:s.group,items:[]};groups.push(g);} g.items.push(s); });
nav.innerHTML = groups.map(g=>
  `<div class="navgrp">${esc(g.name)}</div>` +
  g.items.map(s=>`<button data-screen="${s.id}"><i>${String(++navNo).padStart(2,'0')}</i><span>${esc(s.label)}</span></button>`).join('')
).join('');

function draw(){
  const s = SCREENS.find(x=>x.id===cur);
  stage.innerHTML = s.render();
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', b.dataset.screen===cur ? 'true':'false'));
  window.scrollTo({top:0, behavior:'instant'});
}
function go(id){ cur=id; draw(); }

document.addEventListener('click', e=>{
  const b = e.target.closest('button, [data-go]');
  if(!b) return;
  if(b.dataset.screen) return go(b.dataset.screen);
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.country){ repCountry=b.dataset.country; return draw(); }
  if(b.dataset.lite === 'reset'){ liteAns=[null,null,null,null]; liteI=0; return draw(); }
  if(b.dataset.lite){ liteAns[liteI] = +b.dataset.lite; liteI++; return draw(); }
  if(b.dataset.demo){
    const p = b.parentElement;
    if(p && p.classList.contains('likert')) p.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b ? 'true':'false'));
  }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.z){ calcZ[t.dataset.z] = (+t.value-50)/10; return draw(); }
  if(t.dataset && t.dataset.h){ calcHeld[t.dataset.h] = +t.value; return draw(); }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='selMajor'){ treeMajor=t.value; treeJob=0; return draw(); }
  if(t.id==='selJob'){ treeJob=+t.value; return draw(); }
  if(t.id==='calcJob'){ calcJobCode=t.value; return draw(); }
  if(t.id==='calcTrack'){ calcTrack=t.value; return draw(); }
});
draw();
})();
</script>
