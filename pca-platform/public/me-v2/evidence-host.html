<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경험 적기</title>
<!--
  경험 입력 화면을 플랫폼이 품는 자리.

  **승인된 화면을 다시 짜지 않는다.** 되묻는 말 일흔다섯 보기와 빈칸의 뜻
  셋(모른다 · 아직 안 적었다 · 그런 것이 없었다)이 전부
  `assets/evidence-ui.js` 에 있다. React 로 옮겨 적으면 보기 하나가 빠져도
  아무도 모르고, 빠진 보기는 "아무거나 고르게" 만든다.

  **브라우저 저장소가 진실이 아니다.** 들어올 때 서버가 들고 있던 것을
  넣어 주고, 끝나면 그 세 묶음을 부모 창으로 넘긴다. 저장은 서버가 한다.
-->
<link rel="stylesheet" href="/pca/assets/app.css">
<style>
  body { background: #fff; margin: 0; padding: 0 }
  #evBody { max-width: 760px; margin: 0 auto; padding: 8px 16px 40px }
</style>
</head>
<body>
<div id="evBody"></div>

<!-- **엔진보다 먼저 올린다.** 이 창의 파일들은 올라오는 순간
     PCAI18N.T 를 붙들어 두기 때문에, 뒤에 오면 번역 없는 함수를 평생
     들고 있게 되고 경험 입력 화면만 한국어로 나간다 -->
<script src="/pca/assets/i18n.js"></script>
<script src="/pca/data/report-i18n.js"></script>
<script src="/pca/data/match-glossary.js"></script>
<script src="/pca/data/families.js"></script>
<script src="/pca/data/evidence-rules.js"></script>
<script src="/pca/assets/evidence.js"></script>
<script src="/pca/assets/research.js"></script>
<script src="/pca/assets/evidence-ui.js"></script>
<script>
(function () {
  'use strict';
  var EV = window.PCAEvidence;
  var UI = window.PCAEvidenceUI;
  function q(k) {
    return new URLSearchParams(location.search).get(k) || '';
  }
  /* 부모와 같은 출처일 때만 말을 섞는다. 플랫폼이 내주는 두 주소라
     출처가 같고, 다르면 밖에서 끼워 넣은 창이다 */
  function send(msg) {
    try { parent.postMessage(msg, location.origin); } catch (e) {}
  }

  /* 씨앗을 받아 한 번 그렸는가. 두 번 그리면 적어 둔 것이 날아간다 */
  var started = false;

  /* 이 창의 글자도 두 언어다. 사전이 위에서 먼저 올라온다 */
  var T = window.PCAI18N ? window.PCAI18N.T : function (x) { return x; };

  function start(seed) {
    if (started) return;
    started = true;
    if (seed) {
      EV.saveEvidence(Object.assign(EV.emptyEvidence(), seed.evidence || {}));
      EV.saveResearch(seed.research || []);
      EV.saveTarget(Object.assign(EV.loadTarget(), seed.target || {}));
    }
    UI.open({
      stage: q('stage') || 'bachelor',
      /* 흐름 한가운데서 '그만두기' 라고 쓰면 검사를 접는 단추로 읽힌다 */
      cancelLabel: T(q('flow') === '1' ? '지금은 건너뛰기' : '그만두기'),
      /* `true` 는 저장하고 나간 것이고 `false` 는 그만둔 것이다
         (`evidence-ui.js` 의 evSave · evCancel). 뒤집으면 그만둔 사람의
         빈 경험이 서버에 저장돼 적어 둔 것을 지운다 */
      onDone: function (saved) {
        send({
          type: 'cm.evidence.done',
          saved: !!saved,
          evidence: EV.loadEvidence(),
          research: EV.loadResearch(),
          target: EV.loadTarget()
        });
      }
    });
    send({ type: 'cm.evidence.ready' });
  }

  /* 부모가 서버에서 읽은 것을 건넨다. 주소에 담으면 길이 제한에 걸리고
     브라우저 기록에 경험이 남는다 */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    if (!e.data || e.data.type !== 'cm.evidence.seed') return;
    try { localStorage.clear(); } catch (x) {}
    start(e.data.payload);
  });

  /**
   * **한 번만 부르면 못 듣는다.**
   *
   * 이 창은 올라오자마자 `hello` 를 보내는데, 받는 쪽(React)은 수화가
   * 끝난 뒤에야 듣는 귀를 단다(`useEffect`). 창이 빨리 뜨는 날 —
   * 파일이 캐시에 있는 날이 그렇다 — `hello` 가 그 사이에 지나가고,
   * 그러면 씨앗이 영영 오지 않아 **경험 입력 칸이 빈 상자로 남는다.**
   * 브라우저로 한 바퀴 돌아 찍은 화면에서 실제로 그랬다.
   *
   * 그래서 **씨앗이 올 때까지 다시 부른다.** 받으면 바로 멈추고, 못
   * 받아도 3초 뒤에는 그만둔다: 영영 부르면 부모가 없는 자리(직접 연
   * 주소)에서 창이 계속 말을 건다.
   */
  var calls = 0;
  var hi = setInterval(function () {
    if (started || ++calls > 20) { clearInterval(hi); return; }
    send({ type: 'cm.evidence.hello' });
  }, 150);
  send({ type: 'cm.evidence.hello' });
})();
</script>
</body>
</html>
