<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="CareerMatri">
  <title>CareerMatri</title>
  <!--
    CareerMatri 공식 Primary Logo Mark — layered four-leaf clover mark.

    **이 파일 하나가 유일한 출처다.** 왼쪽 띠 · 손전화 머리띠 · 로그인 ·
    검사 · 결과지 · 계정이 전부 이 주소(`/brand/careermatri/mark.svg`)를
    읽는다. 다른 자리에서 모양을 다시 그리지 않는다: 두 벌을 두면 어느
    날 갈리고, 갈린 날 한 제품이 두 상표로 선다.

    **알파벳 C 가 아니다.** 네 장의 잎이 겹겹이 쌓여 가운데를 비워 둔
    모양이고, 성장과 가능성과 경로와 확장을 뜻한다. 오른쪽 위가 열려
    있는 것은 그 확장의 방향이지 글자의 터진 곳이 아니다.

    모양과 색은 `docs/metri/shots/reference/reference-home-desktop.png`
    의 상표를 12배로 키워 화소마다 읽어서 옮겼다. 잎 넷의 각도와 네
    가지 파랑이 거기서 잰 값이다: 왼쪽 위에서 오른쪽으로 넘어가는 밝은
    잎(cyan) 위에 왼쪽 잎(sky)이 한 겹 얹혀 바깥과 안쪽에 cyan 테가
    남고, 아래 잎(azure)과 오른쪽 잎(royal)이 차례로 닫는다.

    **테도 선도 두지 않는다.** 바깥선을 그리면 잎 넷이 한 덩이로
    굳어 겹친 느낌이 사라진다.

    **색을 글자색에 매지 않았다.** 상표는 어두운 띠 위에도 흰 머리띠
    위에도 같은 색으로 서야 한다. 그래서 `currentColor` 를 쓰지 않는다.
  -->
  <path fill="#04B9FA" d="M12.51 89.68A56 56 0 0 1 88.00 11.50L82.34 29.26L70.00 42.68A20 20 0 0 0 43.04 70.60Z"/>
  <path fill="#0090FA" d="M92.12 105.87A56 56 0 0 1 10.55 86.29L42.34 69.39A20 20 0 0 0 71.47 76.38Z"/>
  <path fill="#0057F6" d="M91.13 38.20L108.50 32.00A56 56 0 0 1 89.68 107.49L70.60 76.96A20 20 0 0 0 77.32 50.00Z"/>
  <path fill="#02A6FD" d="M10.51 72.34A51 51 0 0 1 25.87 22.10L43.27 41.42A25 25 0 0 0 35.74 66.05Z"/>
</svg>
