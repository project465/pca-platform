<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="CareerMatri">
  <title>CareerMatri</title>
  <!--
    CareerMatri 공식 Primary Logo Mark — layered four-leaf clover.

    **이 파일 하나가 유일한 출처다.** 왼쪽 띠 · 손전화 머리띠 · 로그인 ·
    검사 · 결과지 · 계정 · 탭 표시가 전부 이 주소
    (`/brand/careermatri/mark.svg`)를 읽는다. 다른 자리에서 모양을 다시
    그리지 않는다: 두 벌을 두면 어느 날 갈리고, 갈린 날 한 제품이 두
    상표로 선다.

    **알파벳 C 가 아니다. 외곽 원도 아니다.** 앞 판본은 고리 하나를
    조각내고 한쪽을 비운 모양이었고, 그 모양은 작게 줄이면 C 로 읽혔다.
    지금 모양은 가운데를 둘러싼 **잎 넷**이다. 비어 있는 가운데는 잎
    넷이 둘러싸 남긴 자리이지 고리의 안쪽 선이 아니다.

    **모양을 정한 값**(viewBox 120 · 가운데 60,60):

      잎 가운데를 중심에서 32.5 떨어진 대각 네 자리에 두고 반지름
      26.5 로 그린다. 그래서 잎 끝은 59 까지 나가고 이웃한 두 잎
      사이는 36.2 까지만 들어온다(0.61). **이 굴곡이 네잎클로버로
      읽히게 하는 자리다**: 굴곡이 얕으면 둥근 덩이 하나가 되고,
      너무 깊으면 잎 넷이 서로 떨어져 네 점으로 흩어진다.

      이웃한 두 잎이 겹치는 자리는 길이 26 · 두께 7 이고 거기에만
      한 단 짙은 파랑을 둔다. 겹친 자리를 지우면 잎 넷이 **나란히
      놓인 원 넷**으로 읽힌다 — 포개져 있다는 것이 이 상표의 뜻이다.

      가운데 빈자리는 반지름 11 이다. 더 키우면 고리가 되고, 더
      줄이면 24px 에서 메워져 사라진다.

    **색**은 `docs/metri/shots/reference/reference-home-desktop.png` 의
    상표를 열두 배로 키워 화소마다 읽어 옮겼다. 왼쪽 위가 가장 밝은
    cyan 이고 오른쪽 아래가 royal 이다. 겹친 자리의 색은 두 이웃의
    가운데 값을 royal 쪽으로 반쯤 당긴 값이라, **그림자를 그린 것이
    아니고 두 겹이 포개진 것이다.**

    **테두리도 stroke 도 그림자도 두지 않는다.** 24px 에서 테가 먼저
    읽히면 상표가 아니라 아이콘이 된다. 색은 날것으로 적는다
    (`currentColor` 를 쓰지 않는다): 공식 상표의 색은 놓이는 자리의
    글자색을 따라가지 않는다.
  -->
  <defs>
    <mask id="cm-core" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <path d="M0,0 H120 V120 H0 Z" fill="#fff"/>
      <path d="M49,60 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0 Z" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#cm-core)">
    <!-- 잎 넷. 왼쪽 위에서 시계 방향으로 cyan → royal -->
    <path data-leaf="1" fill="#10BCFB" d="M10.519,37.019 a26.5,26.5 0 1,0 53.0,0 a26.5,26.5 0 1,0 -53.0,0 Z"/>
    <path data-leaf="2" fill="#0A93F9" transform="rotate(90 60 60)" d="M10.519,37.019 a26.5,26.5 0 1,0 53.0,0 a26.5,26.5 0 1,0 -53.0,0 Z"/>
    <path data-leaf="3" fill="#0A5FF6" transform="rotate(180 60 60)" d="M10.519,37.019 a26.5,26.5 0 1,0 53.0,0 a26.5,26.5 0 1,0 -53.0,0 Z"/>
    <path data-leaf="4" fill="#0DA8FC" transform="rotate(270 60 60)" d="M10.519,37.019 a26.5,26.5 0 1,0 53.0,0 a26.5,26.5 0 1,0 -53.0,0 Z"/>

    <!-- 이웃한 두 잎이 겹친 자리. 한 겹 더 짙다 -->
    <path data-lap="1" fill="#0C87F8" d="M60,23.823 A26.5,26.5 0 0,1 60,50.215 A26.5,26.5 0 0,1 60,23.823 Z"/>
    <path data-lap="2" fill="#0A6DF7" transform="rotate(90 60 60)" d="M60,23.823 A26.5,26.5 0 0,1 60,50.215 A26.5,26.5 0 0,1 60,23.823 Z"/>
    <path data-lap="3" fill="#0B73F8" transform="rotate(180 60 60)" d="M60,23.823 A26.5,26.5 0 0,1 60,50.215 A26.5,26.5 0 0,1 60,23.823 Z"/>
    <path data-lap="4" fill="#0D8DF9" transform="rotate(270 60 60)" d="M60,23.823 A26.5,26.5 0 0,1 60,50.215 A26.5,26.5 0 0,1 60,23.823 Z"/>
  </g>
</svg>
