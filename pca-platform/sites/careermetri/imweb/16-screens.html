<!-- 홈 · 실제 화면 셋을 옆으로 넘겨 봅니다.
     IMG_TEST · IMG_REPORT · IMG_ORG 를 아임웹에 올린 이미지 주소로 바꿉니다.

     data-cm-auto 는 한 장에 머무는 시간(밀리초)입니다. 이 속성을 지우면
     화살표와 손으로만 넘어갑니다. 포인터가 올라오면, 안쪽에 초점이 있으면,
     탭이 숨으면 멈추고, 모션 최소화를 켠 분에게는 아예 돌지 않습니다. -->
<div class="cm cm-tint">
  <div class="cm-in">
    <div class="cm-head">
    <h2 class="cm-h2">실제 화면</h2>
    <div class="cm-col"><p>학생이 푸는 화면과 돌아오는 리포트 둘입니다. 기계공학
    검사지로 뽑았고, 숫자는 시연 응답이라 실제 학생 데이터가 아닙니다.</p></div>
    </div>
    <div class="cm-sl cm-sl-img" data-cm-auto="6500">
      <div class="cm-sl-head">
        <p>끌거나 넘기거나, 화살표로</p>
        <button class="cm-sl-btn" type="button" data-cm-prev aria-label="이전 화면">&#8592;</button>
        <button class="cm-sl-btn" type="button" data-cm-next aria-label="다음 화면">&#8594;</button>
      </div>
      <div class="cm-sl-track" aria-label="주요 화면 세 장">
        <div class="cm-slide"><figure>
          <img src="IMG_TEST" alt="응시 화면. 5점 척도 문항이 쪽 단위로 나오고 고른 즉시 저장된다.">
          <figcaption>응시 화면 &middot; 문항마다 저장되고 중간에 닫아도 이어서 봅니다</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_REPORT" alt="개인 결과 리포트 첫 화면. 종합 요약과 직무분야 10개 순위가 보인다.">
          <figcaption>개인 결과 리포트 &middot; 종합 요약과 직무분야 10개</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_ORG" alt="의뢰 기관 분석 리포트. 1순위 직무 분포와 교육 수요, 지역 정주 변화가 들어 있다.">
          <figcaption>기관 분석 리포트 &middot; 분포 · 교육 수요 · 정주 변화</figcaption>
        </figure></div>
      </div>
      <div class="cm-sl-dots" aria-hidden="true"></div>
    </div>
  </div>
</div>
