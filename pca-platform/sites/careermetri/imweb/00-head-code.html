<!-- ═══════════════════════════════════════════════════════════
     아임웹 · 환경설정 > SEO(검색엔진최적화) > 고급 설정 > 공통 코드 삽입
     의 [Head Code] 칸에 이 블록을 통째로 붙입니다. 한 번만 붙이면
     모든 페이지에 적용됩니다.

     셀렉터를 전부 cm- 으로 감쌌습니다. body·section·h2 같은 태그를
     직접 잡으면 아임웹 테마가 같이 바뀌기 때문입니다.

     바탕은 밝습니다. 비즈니스 홍보 템플릿의 머리글과 하단이 밝은데
     본문만 어두우면, 페이지가 밝고 어두운 띠로 번갈아 끊겨 보입니다.
     그래서 딥네이비는 바탕이 아니라 활자로 쓰고, 어두운 띠는 맨 위
     한 장(cm-dark)만 둡니다. 바꾸고 싶으면 위젯에 붙이는 class 만
     바꿉니다 — cm(흰 바탕) · cm cm-tint(회색 띠) · cm cm-dark(네이비).
     ═══════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* 브랜드 상수. 바탕이 밝든 어둡든 이 둘은 같은 값이다 */
  --cm-navy:#0F1B2D; --cm-gold:#C9A227;
  /* 밝은 바탕 한 벌. 대비는 재서 골랐다 — 본문 17.3:1, 보조 6.4:1, 금색 글자 5.9:1 */
  --cm-bg:#FFFFFF; --cm-surface:#FFFFFF; --cm-surface2:#F2F4F7;
  --cm-text:#0F1B2D; --cm-mute:#4F6076;
  --cm-line:#DCE2EA; --cm-rule:#B9C4D0;
  /* 금색을 글자로 쓸 때. #C9A227 은 흰 바탕에서 2.4:1 이라 글자로 못 쓴다 */
  --cm-acc:#7A6214; --cm-btn2:#0F1B2D;
  --cm-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cm-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --cm-disp:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
/* 회색 띠. 절이 여럿 이어질 때 하나를 눌러 쉼표를 만든다 */
.cm.cm-tint{--cm-bg:#F2F4F7; --cm-surface:#F2F4F7; --cm-surface2:#FFFFFF;}
/* 네이비 띠. 맨 위 한 장에만 쓴다 */
.cm.cm-dark{
  --cm-bg:#0F1B2D; --cm-surface:#0F1B2D; --cm-surface2:#16273C;
  --cm-text:#E8EDF2; --cm-mute:#8D9CAE;
  --cm-line:#24374F; --cm-rule:#24374F;
  --cm-acc:#C9A227; --cm-btn2:#C9A227;
}

/* 위젯 하나가 곧 한 절이다. 바깥 여백은 아임웹 섹션 설정으로 줘도 된다 */
.cm{
  background:var(--cm-bg); color:var(--cm-text);
  font-family:var(--cm-body); font-size:16px; line-height:1.75;
  word-break:keep-all; overflow-wrap:break-word;
  padding:64px 20px; margin:0;
}
.cm *{box-sizing:border-box;}
.cm-in{max-width:1080px; margin:0 auto;}
.cm-col{max-width:640px;}
.cm img{max-width:100%; display:block;}
.cm a{color:var(--cm-text);}
.cm strong{font-weight:600;}
.cm :focus-visible{outline:2px solid var(--cm-acc); outline-offset:3px;}

/* 절 머리. 금색 짧은 괘선을 이름 위에 둔다. 괘선을 화면 끝까지
   늘이는 판은 절마다 똑같이 반복되면 틀처럼 읽혀서 쓰지 않았다 */
.cm-eyebrow{
  font-family:var(--cm-body); font-weight:600; font-size:13px;
  letter-spacing:.02em; color:var(--cm-acc); margin:0 0 12px;
}
.cm-eyebrow::before{
  content:""; display:block; width:30px; height:2px;
  background:var(--cm-gold); margin-bottom:14px;
}
/* 한 절 안의 둘째 머리. 절 머리보다 한 단 아래로 읽히게 전폭 괘선을 쓴다 */
.cm-sublabel{
  font-family:var(--cm-body); font-weight:600; font-size:13px; color:var(--cm-mute);
  letter-spacing:.02em; margin:52px 0 14px; padding-top:14px;
  border-top:1px solid var(--cm-line);
}
.cm-h2{
  font-family:var(--cm-disp); font-weight:800; font-size:clamp(24px,3.4vw,33px);
  line-height:1.3; letter-spacing:-.02em; margin:0 0 18px; text-wrap:balance;
  color:var(--cm-text);
}
.cm-h3{font-family:var(--cm-disp); font-weight:700; font-size:17px; margin:0 0 6px; color:var(--cm-text);}
.cm p{margin:0 0 16px;}
.cm-lead{font-size:18px;}
.cm-sub{color:var(--cm-mute);}
.cm-small{font-size:13.5px; color:var(--cm-mute); line-height:1.7;}

.cm-h1{
  font-family:var(--cm-disp); font-weight:800; font-size:clamp(30px,5.4vw,52px);
  line-height:1.2; letter-spacing:-.035em; margin:0 0 22px; max-width:18ch;
  text-wrap:balance; color:var(--cm-text);
}
/* 강조한 말이 줄바꿈으로 쪼개지면 강조가 아니라 사고로 보인다 */
.cm-h1 span{color:var(--cm-acc); white-space:nowrap;}
.cm-cta{display:flex; gap:12px; flex-wrap:wrap; margin-top:30px;}
.cm-btn{
  font-family:var(--cm-body); font-weight:600; font-size:15px; padding:13px 26px;
  text-decoration:none; display:inline-block;
  border:1px solid var(--cm-gold); color:var(--cm-navy); background:var(--cm-gold);
}
.cm-btn.cm-ghost{background:transparent; color:var(--cm-btn2); border-color:var(--cm-btn2);}
.cm-btn:hover{background:#B38E1C; border-color:#B38E1C;}
.cm-btn.cm-ghost:hover{background:rgba(201,162,39,.14); border-color:var(--cm-gold); color:var(--cm-btn2);}

/* 칸을 카드로 띄우지 않는다. 1px 틈이 괘선으로 보이게 깔아 둔 것이다 */
.cm-grid{display:grid; gap:1px; background:var(--cm-line); margin-top:8px;}
.cm-g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
.cm-g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.cm-g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.cm-cell{background:var(--cm-surface); padding:24px 22px;}
/* 칸 이름표. 순서가 아닌 것에는 번호를 붙이지 않는다 */
.cm-n{font-family:var(--cm-body); font-weight:600; font-size:12px; color:var(--cm-acc);
  letter-spacing:.02em; display:block; margin-bottom:10px;}
.cm-cell p{margin:0; font-size:14.5px; color:var(--cm-mute); line-height:1.7;}
.cm-cell ul{margin:10px 0 0; padding:0; list-style:none;}
.cm-cell li{font-size:14.5px; color:var(--cm-mute); padding-left:16px;
  position:relative; line-height:1.7;}
.cm-cell li::before{content:""; position:absolute; left:2px; top:12px;
  width:5px; height:5px; background:var(--cm-gold);}

/* 결과지는 흰 문서다. 흰 바탕에 그냥 얹으면 종이 끝이 안 보이므로
   회색 받침에 괘선을 둘러 책상에 놓은 것처럼 만든다 */
.cm-plate{margin:28px 0 0; background:var(--cm-surface2); padding:16px;
  border:1px solid var(--cm-line);}
.cm-plate img{border:1px solid var(--cm-rule);}
.cm-plate figcaption{font-family:var(--cm-mono); font-size:11.5px; color:var(--cm-mute);
  letter-spacing:.04em; padding:12px 2px 2px;}

.cm-tw{overflow-x:auto; margin-top:22px;}
.cm-tw table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px;}
.cm-tw th,.cm-tw td{text-align:left; padding:12px 14px; border-bottom:1px solid var(--cm-line);}
.cm-tw th{font-family:var(--cm-body); font-size:12px; letter-spacing:.02em;
  color:var(--cm-mute); font-weight:600; border-bottom:1px solid var(--cm-rule);}
.cm-tw td{color:var(--cm-mute); vertical-align:top;}
.cm-tw td.cm-name{color:var(--cm-text); font-weight:500;}
.cm-tw td.cm-live{color:var(--cm-acc); font-weight:600;}
/* th 에도 걸어야 머리글이 자기 숫자 칸과 같은 쪽으로 붙는다 */
.cm-tw .cm-num{text-align:right;}
.cm-tw td.cm-num{font-family:var(--cm-mono); font-variant-numeric:tabular-nums;}

/* 문항 예시처럼 그대로 인용하는 줄 */
.cm-items{margin-top:20px; display:grid; gap:10px;}
.cm-item{background:var(--cm-surface2); border-left:2px solid var(--cm-gold);
  padding:14px 16px; font-size:14.5px; line-height:1.65;}
.cm-item b{display:block; font-family:var(--cm-body); font-size:12px;
  color:var(--cm-acc); letter-spacing:.02em; margin-bottom:5px; font-weight:600;}

.cm-facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1px; background:var(--cm-line); margin-top:8px;}
.cm-fact{background:var(--cm-surface); padding:20px 18px;}
.cm-fact b{display:block; font-family:var(--cm-disp); font-weight:800; font-size:26px;
  color:var(--cm-text); letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.cm-fact span{font-size:13px; color:var(--cm-mute);}

.cm-packs{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); margin-top:22px;}
.cm-pack{border:1px solid var(--cm-line); padding:26px 24px; background:var(--cm-surface);}
.cm-pack.cm-pick{border:1px solid var(--cm-gold); border-top:3px solid var(--cm-gold);
  background:var(--cm-surface2);}
.cm-tag{font-family:var(--cm-body); font-weight:600; font-size:12px; letter-spacing:.06em;
  color:var(--cm-acc); display:block; margin-bottom:12px;}
.cm-price{font-family:var(--cm-disp); font-weight:800; font-size:23px;
  margin:0 0 4px; letter-spacing:-.02em; color:var(--cm-text);
  font-variant-numeric:tabular-nums;}
.cm-unit{font-size:13px; color:var(--cm-mute); margin-bottom:16px;}
.cm-pack ul{margin:0; padding:0; list-style:none;}
.cm-pack li{font-size:14px; color:var(--cm-mute); padding:5px 0 5px 20px; position:relative;}
.cm-pack li.cm-on{color:var(--cm-text);}
.cm-pack li::before{content:"\25CB"; position:absolute; left:0; color:var(--cm-mute);
  opacity:.5; font-size:12px; top:7px;}
.cm-pack li.cm-on::before{content:"\25CF"; color:var(--cm-gold); opacity:1;}

/* 번호가 뜻을 갖는 유일한 곳. 순서대로 밟는 절차라서 번호를 붙인다 */
.cm-steps{counter-reset:cmstep; display:grid; gap:1px; background:var(--cm-line); margin-top:22px;}
.cm-step{background:var(--cm-surface); padding:18px 22px; display:flex; gap:16px; align-items:baseline;}
.cm-step::before{counter-increment:cmstep; content:counter(cmstep,decimal-leading-zero);
  font-family:var(--cm-mono); font-size:12px; color:var(--cm-acc); flex:0 0 auto;}
.cm-step b{font-weight:600; flex:0 0 7.5em;}
.cm-step span{color:var(--cm-mute); font-size:14.5px;}
/* 좁은 화면에서는 고정폭이 설명을 짜부라뜨린다. 그때만 아래로 접는다 */
@media (max-width:540px){
  .cm-step{flex-wrap:wrap; gap:6px 14px;}
  .cm-step b{flex:0 0 auto;}
  .cm-step span{flex:1 1 100%; padding-left:28px;}
}

.cm-pull{border-left:3px solid var(--cm-gold); padding:2px 0 2px 20px; margin:28px 0;
  font-family:var(--cm-disp); font-weight:700; font-size:clamp(17px,2.2vw,20px);
  line-height:1.55; letter-spacing:-.01em; color:var(--cm-text);}
.cm-need{color:var(--cm-acc);}
.cm-brand{font-family:var(--cm-disp); font-weight:800; font-size:16px; letter-spacing:.06em;
  color:var(--cm-text);}
.cm-brand em{color:var(--cm-acc); font-style:normal;}
@media (prefers-reduced-motion:reduce){.cm *{transition:none!important; animation:none!important;}}
</style>
