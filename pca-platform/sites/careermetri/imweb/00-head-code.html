<!-- Two font links. Pretendard first (a variable font with a dynamic subset,
     so only the glyphs in use are fetched), Noto Sans KR second as the loaded
     fallback. The fallback only downloads on a day the first one fails: an
     unused @font-face never fetches its files. Same stack as the Korean site,
     so both read as one system. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<!-- A second face, for figures and for the labels that name a measurement.
     An engineering document sets its prose in one face and its data in
     another; doing the same here is what separates a specification from a
     brochure, and it costs one stylesheet. Prose never uses it. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* 색을 한 단 내렸다. 네이비가 더 깊고, 연회색 띠가 회색이 아니라 푸른
     쪽으로 간다. 중립 회색은 고르지 않은 색으로 읽히고, 이 제품은 중립적일
     이유가 없다. 대비는 다시 재서 본문 17.6:1 · 보조 6.5:1 · 금색 글자
     5.9:1 이다. */
  --cm-navy:#0B1524; --cm-gold:#C9A227;
  --cm-bg:#FFFFFF; --cm-surface:#FFFFFF; --cm-surface2:#EDF1F6;
  --cm-text:#0B1524; --cm-mute:#4B5D73;
  --cm-line:#DFE6EE; --cm-rule:#B9C4D2;
  --cm-acc:#7A6214; --cm-btn2:#0B1524;
  /* Every corner is rounded. Nothing on this site is square. */
  --cm-r:32px; --cm-r2:22px; --cm-r3:3px; --cm-pill:999px;
  /* One very shallow shadow on raised surfaces. A border alone reads flat,
     and a heavy shadow reads like an old card. */
  --cm-lift:0 1px 2px rgba(15,27,45,.035), 0 14px 38px rgba(15,27,45,.065);
  /* One typeface only. Headings, body and figures from different families
     stop reading as one page. Figures line up with tabular-nums rather than
     by switching to a second font. */
  --cm-body:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,
    BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --cm-disp:var(--cm-body);
  --cm-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.cm.cm-tint{--cm-bg:#EDF1F6; --cm-surface:#EDF1F6; --cm-surface2:#FFFFFF;}
.cm.cm-dark{
  /* A flat fill of one navy over 900 pixels reads as a printed block. The
     gradient is shallow enough that nobody sees a gradient. */
  background-image:linear-gradient(178deg,#10202F 0%,#0B1524 48%,#070F1B 100%);
  --cm-bg:#0B1524; --cm-surface:#0B1524; --cm-surface2:#122132;
  --cm-text:#E6EDF4; --cm-mute:#8798AC;
  --cm-line:#1D2F44; --cm-rule:#2B4159;
  --cm-acc:#C9A227; --cm-btn2:#C9A227;
}
/* Registration marks at the corners, the way a drawing sheet is trimmed.
   Only on the dark bands, where there is room for them to be quiet. */
.cm.cm-dark{position:relative;}
.cm.cm-dark::before, .cm.cm-dark::after{
  content:""; position:absolute; width:13px; height:13px; pointer-events:none;
  border:1px solid var(--cm-rule); opacity:.55;
}
.cm.cm-dark::before{top:26px; left:26px; border-right:0; border-bottom:0;}
.cm.cm-dark::after{bottom:26px; right:26px; border-left:0; border-top:0;}
/* The opening band paints its own grid on ::before, so its marks go on a
   child instead of fighting for the same pseudo-element. */
.cm.cm-dark.cm-open::before{border:0; top:0; left:0; width:auto; height:auto; opacity:1;}

/* 메뉴가 같은 페이지 안 위치로 보내는 구조라, 뛰어간 자리에서 제목이
   상단 막대에 가리면 안 된다. 여유는 상단 높이보다 넉넉하게 준다. */
.cm[id]{scroll-margin-top:96px;}
.cm{
  background:var(--cm-bg); color:var(--cm-text);
  font-family:var(--cm-body); font-size:16px; line-height:1.78;
  letter-spacing:-.011em; word-break:keep-all; overflow-wrap:break-word;
  padding:92px 20px; margin:0;
}
/* 띠 자신도 포함한다. `.cm *` 는 자손만 잡아서, 폭을 못 박기 전까지는
   아무 일도 없었지만 100vw 를 주는 순간 좌우 여백 20px 씩이 그 위에
   얹혀 가로로 40px 넘쳤다. */
.cm, .cm *{box-sizing:border-box;}
/* Every section starts on the same vertical line. Different widths per
   section make the left edge wobble as the page scrolls. */
.cm-in{max-width:1040px; margin:0 auto;}
/* Section head: the heading holds the left column, the opening paragraph the
   right. In one column the text measure leaves the right side empty on every
   section, which reads as unfinished rather than composed. */
.cm-head{display:grid; gap:14px 56px; align-items:start; margin-bottom:26px;}
@media (min-width:900px){
  .cm-head{grid-template-columns:minmax(0,7fr) minmax(0,9fr);}
  .cm-head > .cm-h2{margin:0; padding-top:2px;}
  .cm-head > .cm-col{max-width:none;}
  .cm-head > .cm-col > p:last-child{margin-bottom:0;}
}
.cm-col{max-width:660px;}
.cm img{max-width:100%; display:block;}
.cm a{color:var(--cm-text);}
.cm strong{font-weight:600;}
.cm :focus-visible{outline:2px solid var(--cm-acc); outline-offset:3px;}

/* Headings are short noun phrases. A sentence per section reads as ad copy. */
.cm-h2{
  font-family:var(--cm-disp); font-weight:700; font-size:clamp(25px,3.1vw,36px);
  line-height:1.26; letter-spacing:-.035em; margin:0 0 14px; color:var(--cm-text);
  text-wrap:balance;
}
.cm-h3{font-family:var(--cm-disp); font-weight:700; font-size:16px; margin:0 0 7px; color:var(--cm-text);}
/* A label that names a measurement wears the technical face; a label that
   introduces prose does not. The rule is what the label is for, not where
   it sits. */
/* 소제목의 괘선은 도면 표제란의 모서리처럼 왼쪽 한 토막만 굵다. 절 전체를
   가로지르는 같은 굵기의 선을 반복하는 것보다 시트 한 장처럼 읽힌다. */
.cm-sublabel{
  font-family:var(--cm-mono); font-weight:500; font-size:12.5px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--cm-text);
  margin:48px 0 14px; padding-top:16px; border-top:1px solid var(--cm-line);
  position:relative;
}
.cm-sublabel::before{content:""; position:absolute; left:0; top:-1.5px;
  width:54px; border-top:3px solid var(--cm-gold);}
.cm-n, .cm-reach, .cm-tw thead th, .cm-tw th[scope=row], .cm-try > p,
.cm-tstep em, .cm-tag{font-family:var(--cm-mono); font-weight:500;}
.cm-kpi b, .cm-tile b, .cm-price, .cm-vlist b, .cm-bar b,
.cm-tw td.cm-num, .cm-spec dt{font-family:var(--cm-mono);}
.cm-kpi b, .cm-tile b{font-weight:600; letter-spacing:-.02em;}
.cm p{margin:0 0 15px;}
.cm-sub{color:var(--cm-mute);}
.cm-small{font-size:13.5px; color:var(--cm-mute); line-height:1.75;}

.cm-h1{
  font-family:var(--cm-disp); font-weight:700; font-size:clamp(33px,5.4vw,60px);
  line-height:1.12; letter-spacing:-.042em; margin:0 0 20px; color:var(--cm-text);
  max-width:17ch; text-wrap:balance;
}
@media (max-width:760px){.cm-h1{max-width:none;}}
.cm-cta{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px;}
.cm-btn{
  font-family:var(--cm-body); font-weight:600; font-size:15px; padding:12px 24px;
  text-decoration:none; display:inline-block; border-radius:var(--cm-pill);
  border:1px solid var(--cm-gold); color:var(--cm-navy); background:var(--cm-gold);
}
.cm-btn{transition:transform .2s cubic-bezier(.2,.7,.3,1), background .2s, border-color .2s, box-shadow .2s;}
.cm-btn.cm-ghost{background:transparent; color:var(--cm-btn2); border-color:var(--cm-rule);}
.cm-btn:hover{background:#B38E1C; border-color:#B38E1C; transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(201,162,39,.28);}
.cm-btn.cm-ghost:hover{background:rgba(201,162,39,.14); border-color:var(--cm-gold);
  box-shadow:none;}
.cm-btn:active{transform:translateY(0);}

/* Specification tables. The most used container on this site. */
.cm-tw{overflow-x:auto; margin:20px 0 0; border:1px solid var(--cm-line);
  border-radius:var(--cm-r); background:var(--cm-surface);}
.cm-tw table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:440px;}
.cm-tw th,.cm-tw td{text-align:left; padding:16px 20px; border-bottom:1px solid var(--cm-line);}
.cm-tw tr:last-child th,.cm-tw tr:last-child td{border-bottom:0;}
/* Head cells were filled grey and row labels filled grey again, which made
   every table look like a form from a decade ago. A small capitalised label
   over a single rule does the same job and lets the figures carry the block. */
.cm-tw thead th{font-family:var(--cm-body); font-size:11px; color:var(--cm-mute);
  font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  padding-top:18px; padding-bottom:12px;
  background:transparent; border-bottom:1px solid var(--cm-rule);}
.cm-tw td{color:var(--cm-mute); vertical-align:top;}
.cm-tw td.cm-name,.cm-tw th[scope=row]{color:var(--cm-text); font-weight:600; white-space:nowrap;}
.cm-tw th[scope=row]{background:transparent; width:10.5em; vertical-align:top;
  font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--cm-mute); font-weight:600; padding-top:19px;}
.cm-tw td.cm-live{color:var(--cm-acc); font-weight:600; white-space:nowrap;}
.cm-tw .cm-num{text-align:right;}
.cm-tw td.cm-num{font-variant-numeric:tabular-nums;}
@media (max-width:540px){.cm-tw th[scope=row]{width:7.5em; font-size:13px;}}

/* Cells stand apart. Butted together on a 1px rule they set into one table. */
.cm-grid{display:grid; gap:16px; margin-top:22px;}
.cm-g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.cm-g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.cm-cell{background:var(--cm-surface); padding:28px 26px 30px;
  border:1px solid var(--cm-line); border-radius:var(--cm-r); box-shadow:var(--cm-lift);
  transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s, border-color .28s;}
@media (hover:hover){
  .cm-cell:hover{transform:translateY(-3px); border-color:var(--cm-rule);
    box-shadow:0 2px 4px rgba(15,27,45,.04), 0 22px 48px rgba(15,27,45,.10);}
}
.cm-n{font-family:var(--cm-body); font-weight:600; font-size:12.5px; color:var(--cm-acc);
  display:block; margin-bottom:9px;}
.cm-cell p{margin:0; font-size:14.5px; color:var(--cm-mute); line-height:1.75;}
.cm-cell ul{margin:9px 0 0; padding:0; list-style:none;}
.cm-cell li{font-size:14.5px; color:var(--cm-mute); padding-left:15px;
  position:relative; line-height:1.8;}
.cm-cell li::before{content:""; position:absolute; left:1px; top:13px;
  width:5px; height:5px; border-radius:50%; background:var(--cm-rule);}

/* The report is a white document. A mount and a hairline put it on a desk. */
.cm-plate{margin:26px 0 0; background:var(--cm-surface2); padding:16px;
  border:1px solid var(--cm-line); border-radius:var(--cm-r); box-shadow:var(--cm-lift);}
.cm-plate img{border:1px solid var(--cm-rule); border-radius:var(--cm-r2);}
.cm-plate figcaption{font-size:12.5px; color:var(--cm-mute); padding:11px 2px 1px;}

/* Rows that quote an item verbatim. */
.cm-items{margin-top:18px; display:grid; gap:9px;}
.cm-item{background:var(--cm-surface2); border:1px solid var(--cm-line);
  border-left:3px solid var(--cm-gold); border-radius:var(--cm-r);
  padding:16px 20px; font-size:14.5px; line-height:1.72;}
.cm-item b{display:block; font-size:12.5px; color:var(--cm-acc);
  margin-bottom:4px; font-weight:600;}

/* The only place a number means something: steps taken in order. */
.cm-steps{counter-reset:cmstep; display:grid; gap:10px; margin-top:22px;}
.cm-step{background:var(--cm-surface); padding:18px 24px; display:flex; gap:14px;
  align-items:baseline; border:1px solid var(--cm-line); border-radius:var(--cm-r2);}
.cm-step::before{counter-increment:cmstep; content:counter(cmstep,decimal-leading-zero);
  font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums;
  color:var(--cm-acc); flex:0 0 auto;}
.cm-step b{font-weight:600; flex:0 0 11em;}
.cm-step span{color:var(--cm-mute); font-size:14.5px;}
@media (max-width:540px){
  .cm-step{flex-wrap:wrap; gap:5px 14px;}
  .cm-step b{flex:0 0 auto;}
  .cm-step span{flex:1 1 100%; padding-left:26px;}
}

.cm-packs{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); margin-top:20px;}
.cm-pack{border:1px solid var(--cm-line); border-radius:var(--cm-r);
  padding:28px 26px; background:var(--cm-surface); box-shadow:var(--cm-lift);}
.cm-pack.cm-pick{border-color:var(--cm-gold); border-top:3px solid var(--cm-gold);
  background:var(--cm-surface2);}
.cm-tag{font-weight:600; font-size:12.5px; color:var(--cm-acc); display:block; margin-bottom:10px;}
.cm-price{font-family:var(--cm-disp); font-weight:700; font-size:25px;
  margin:0 0 5px; letter-spacing:-.03em; color:var(--cm-text);
  font-variant-numeric:tabular-nums;}
.cm-unit{font-size:13px; color:var(--cm-mute); margin-bottom:14px;}
.cm-pack ul{margin:0; padding:0; list-style:none;}
.cm-pack li{font-size:14px; color:var(--cm-mute); padding:5px 0 5px 19px; position:relative;}
.cm-pack li.cm-on{color:var(--cm-text);}
.cm-pack li::before{content:""; position:absolute; left:2px; top:13px; width:7px; height:7px;
  border-radius:50%; border:1px solid var(--cm-rule);}
.cm-pack li.cm-on::before{background:var(--cm-gold); border-color:var(--cm-gold);}

/* The note runs the full width of the section and holds its own measure
   inside. Stopping the box itself at reading width leaves a stub under a
   full-width table, which reads as a layout that gave up rather than as a
   deliberate column. */
.cm-note{background:var(--cm-surface2); border:1px solid var(--cm-line);
  border-radius:var(--cm-r); padding:22px 26px; margin-top:24px;}
.cm-note p{margin:0; font-size:14px; color:var(--cm-mute); line-height:1.8;
  max-width:74ch;}
.cm-note p + p{margin-top:9px;}

.cm-brand{font-family:var(--cm-disp); font-weight:700; font-size:16px; letter-spacing:.05em;
  color:var(--cm-text);}
/* The title block. A drawing states what it is, at what scale and when, in a
   ruled box at its corner; this is that box, and every value in it is
   checkable. It is set in the technical face because all of it is data. */
.cm-block{margin:26px 0 0; padding-top:18px; border-top:1px solid var(--cm-rule);
  display:grid; gap:0; grid-template-columns:repeat(auto-fit,minmax(248px,1fr));}
.cm-block > div{display:flex; gap:14px; align-items:baseline; padding:9px 18px 9px 0;
  border-bottom:1px solid var(--cm-line);}
.cm-block dt{font-family:var(--cm-mono); font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--cm-mute); flex:0 0 9.5em;}
.cm-block dd{margin:0; font-family:var(--cm-mono); font-size:12px; color:var(--cm-text);}
.cm-brand em{color:var(--cm-acc); font-style:normal;}
/* Sideways sliders. Built on scroll-snap, so a finger or a trackpad still
   works if the script fails. The arrows and dots are attached by the script
   at the end of this block. */
.cm-sl{margin-top:20px;}
.cm-sl-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.cm-sl-head p{margin:0; font-size:13.5px; color:var(--cm-mute); margin-right:auto;}
.cm-sl-btn{width:38px; height:38px; flex:0 0 auto; cursor:pointer;
  background:var(--cm-surface); color:var(--cm-text);
  border:1px solid var(--cm-line); border-radius:var(--cm-pill);
  font-family:var(--cm-body); font-size:15px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;}
.cm-sl-btn:hover:not([disabled]){border-color:var(--cm-gold);}
.cm-sl-btn[disabled]{opacity:.35; cursor:default;}
.cm-sl-track{
  display:grid; grid-auto-flow:column; grid-auto-columns:minmax(252px,1fr);
  gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; scrollbar-width:none; padding-bottom:4px;
}
.cm-sl-track::-webkit-scrollbar{display:none;}
.cm-sl-track > *{scroll-snap-align:start;}
@media (min-width:760px){.cm-sl-track{grid-auto-columns:minmax(276px,1fr);}}
.cm-slide{
  background:var(--cm-surface); border:1px solid var(--cm-line);
  border-radius:var(--cm-r); padding:24px 22px 26px; min-width:0;
  box-shadow:var(--cm-lift);
}
.cm-slide .cm-n{margin-bottom:8px;}
.cm-slide h3{font-family:var(--cm-disp); font-weight:700; font-size:16px;
  margin:0 0 7px; color:var(--cm-text);}
.cm-slide p{margin:0; font-size:14px; color:var(--cm-mute); line-height:1.75;}
/* The lead slide carries a gold rule along its top edge. */
.cm-slide.cm-lead{border-top:3px solid var(--cm-gold);}
.cm-slide figure{margin:0;}
.cm-slide img{border:1px solid var(--cm-rule); border-radius:var(--cm-r2);}
.cm-slide figcaption{font-size:12.5px; color:var(--cm-mute); padding-top:10px;}
.cm-sl-dots{display:flex; gap:6px; margin-top:14px;}
.cm-sl-dot{width:24px; height:5px; border-radius:999px; background:var(--cm-line);
  border:0; padding:0; cursor:pointer;}
.cm-sl-dot[aria-current="true"]{background:var(--cm-gold);}
/* A hairline that fills as the slider runs. With eleven slides the dots stop
   telling anyone where they are; a filled line does it at a glance. */
.cm-sl-rail{position:relative; height:3px; margin-top:16px; border-radius:999px;
  background:var(--cm-line); overflow:hidden;}
.cm-sl-rail i{position:absolute; inset:0 auto 0 0; display:block; width:0;
  background:var(--cm-gold); border-radius:999px;
  transition:width .38s cubic-bezier(.2,.7,.3,1);}
/* Image variant. One picture per view, and the slide is the mount around it
   rather than a card with text in it. */
.cm-sl-img .cm-sl-track{grid-auto-columns:100%;}
@media (min-width:760px){.cm-sl-img .cm-sl-track{grid-auto-columns:100%;}}
.cm-sl-img .cm-slide{background:var(--cm-surface2); padding:16px; cursor:grab;
  transition:opacity .4s ease;}
/* The slide half out of frame is dimmed, so the eye is told which one is
   being shown without a border or a shadow being added to say it. */
.cm-anim .cm-sl-img .cm-slide{opacity:.34;}
.cm-anim .cm-sl-img .cm-slide.cm-here{opacity:1;}
.cm-sl-img .cm-slide:active{cursor:grabbing;}
/* The browser's own image drag would start instead of the slider's. */
.cm-sl-img .cm-slide img{width:100%; -webkit-user-drag:none; user-select:none;}

/* ── The opening band. A dot lattice at very low contrast, fading out as it
   falls, and one warm pool of light behind the headline. Both are painted
   with gradients rather than an image, so they cost nothing to load and stay
   sharp at any width. The band has to be positioned for them to sit inside. */
.cm-open{position:relative; overflow:hidden; isolation:isolate;}
/* Graph paper rather than a dot field: a fine grid with every fifth line
   heavier, which is the ruling of the paper this kind of work is drawn on.
   Four gradients, no image, sharp at any width. */
.cm-open::before{
  content:""; position:absolute; inset:0; z-index:-2; color:var(--cm-mute);
  background-image:
    linear-gradient(to right, currentColor 1px, transparent 1px),
    linear-gradient(to bottom, currentColor 1px, transparent 1px),
    linear-gradient(to right, currentColor 1px, transparent 1px),
    linear-gradient(to bottom, currentColor 1px, transparent 1px);
  background-size:132px 132px, 132px 132px, 33px 33px, 33px 33px;
  /* 실제 화면에서 보니 모눈이 글자와 다툰다. 종이의 괘선은 읽는 동안
     보이지 않아야 하고, 보려고 하면 그때 보이면 된다. */
  opacity:.115;
  -webkit-mask-image:linear-gradient(168deg,#000 0%,rgba(0,0,0,.4) 48%,transparent 88%);
  mask-image:linear-gradient(168deg,#000 0%,rgba(0,0,0,.4) 48%,transparent 88%);
}
/* A cool lift rather than a gold one. Gold spread thin over navy goes brown
   and reads as a stain on the photograph; the metal is worth more kept for
   the things that are actually gold, the buttons and the one live pin. */
.cm-open::after{
  content:""; position:absolute; z-index:-1;
  top:-46%; right:-18%; width:min(880px,96vw); aspect-ratio:1;
  background:radial-gradient(circle at 50% 50%,
    rgba(62,104,164,.42) 0%, rgba(40,70,112,.20) 38%, transparent 70%);
  pointer-events:none;
}
.cm-open > .cm-in{position:relative; z-index:1;}

/* Headline figures. These are the instrument's specification, not decoration,
   so they are allowed to be the largest thing after the headline. */
/* Dimensioned, the way a drawing states a length: an extension line at each
   end of the run and a tick where one figure stops and the next begins. */
.cm-kpi{display:grid; gap:2px 0; margin:38px 0 4px; position:relative;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--cm-rule);}
.cm-kpi::before, .cm-kpi::after{content:""; position:absolute; top:-7px; height:14px;
  width:1px; background:var(--cm-rule);}
.cm-kpi::before{left:0;} .cm-kpi::after{right:0;}
.cm-kpi > div{padding:22px 22px 18px; border-bottom:1px solid var(--cm-line);
  border-right:1px solid var(--cm-line); position:relative;}
.cm-kpi > div + div::before{content:""; position:absolute; top:-5px; left:-1px;
  height:10px; width:1px; background:var(--cm-rule);}
.cm-kpi > div:first-child{padding-left:0;}
.cm-kpi b{display:block; font-family:var(--cm-disp); font-weight:700;
  font-size:clamp(28px,3.4vw,40px); line-height:1.05; letter-spacing:-.04em;
  color:var(--cm-text); font-variant-numeric:tabular-nums;}
.cm-kpi span{display:block; margin-top:8px; font-size:13px; color:var(--cm-mute);
  line-height:1.5;}
@media (max-width:620px){
  .cm-kpi > div{padding:16px 16px 15px;}
  .cm-kpi > div:nth-child(2n){border-right:0;}
}
@media (min-width:621px){.cm-kpi > div:last-child{border-right:0;}}

/* A short specification list under the figures, as label and value on one
   rule each. It replaces the bordered table the opening band used to carry. */
.cm-spec{margin-top:26px; border-top:1px solid var(--cm-line);}
.cm-spec div{display:grid; gap:4px 28px; padding:15px 0;
  border-bottom:1px solid var(--cm-line);}
@media (min-width:660px){.cm-spec div{grid-template-columns:11em minmax(0,1fr);}}
.cm-spec dt, .cm-spec b{font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--cm-mute); font-weight:600; padding-top:3px;}
.cm-spec span{font-size:14.5px; color:var(--cm-text);}

/* Sections arrive rather than appear. The starting state is added by script,
   never by this stylesheet: a reader whose JavaScript failed must not be left
   looking at a page of invisible blocks. */
.cm-anim .cm-rise{opacity:0; transform:translateY(14px);
  transition:opacity .62s cubic-bezier(.2,.7,.3,1), transform .62s cubic-bezier(.2,.7,.3,1);}
.cm-anim .cm-rise.cm-in-view{opacity:1; transform:none;}

/* ── The report's own charts, on the home page.
   One series, so there is no categorical palette and no legend: the tab
   above the chart names what is drawn. Gold carries the data and never
   carries text; every label and figure stays in the text tokens, because
   gold on white is 2.4:1 and unreadable as type. The figures are listed
   beside the shape, so nothing here depends on reading an angle. */
.cm-tabs{display:inline-flex; gap:4px; margin-top:6px; padding:4px;
  border:1px solid var(--cm-line); border-radius:var(--cm-pill);
  background:var(--cm-surface2);}
.cm-tabs button{font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  padding:9px 18px; border:0; border-radius:var(--cm-pill);
  background:transparent; color:var(--cm-mute);
  transition:background .2s, color .2s;}
.cm-tabs button[aria-pressed="true"]{background:var(--cm-surface); color:var(--cm-text);
  box-shadow:0 1px 2px rgba(15,27,45,.08);}
.cm-tabs button:hover[aria-pressed="false"]{color:var(--cm-text);}

.cm-chart{display:grid; gap:22px 44px; align-items:start; margin-top:22px;}
@media (min-width:860px){.cm-chart{grid-template-columns:minmax(0,8fr) minmax(0,4fr);}}
.cm-radarwrap{min-width:0;}
.cm-radar{display:block; width:100%; height:auto; overflow:visible;}
/* The hidden attribute is an HTML one: the browser's rule for it is namespaced
   to HTML elements, so on an <svg> it does nothing and both charts draw on top
   of each other. */
.cm-radar[hidden]{display:none;}
.cm-radar .cm-rg polygon{fill:none; stroke:var(--cm-line); stroke-width:1;}
.cm-radar .cm-rg-mid{stroke:var(--cm-rule);}
.cm-radar .cm-rg-out{stroke:var(--cm-rule); stroke-width:1.4;}
.cm-radar .cm-sp line{stroke:var(--cm-line); stroke-width:1;}
/* Tick marks across the spokes, the way a plot is ruled rather than a
   background being drawn behind it. */
.cm-radar .cm-tick line{stroke:var(--cm-rule); stroke-width:1;}
.cm-radar .cm-tick text{font-family:var(--cm-mono); font-size:10.5px; fill:var(--cm-mute);}
/* Two series, and one of them is the point. The cohort is context, so it is
   a neutral dashed outline with no fill; the student is the accent. Identity
   never rests on colour alone: the legend names both, the figures are listed
   beside the plot, and the dash pattern separates them in print and for a
   reader who cannot tell the hues apart. */
.cm-radar .cm-mean{fill:none; stroke:var(--cm-rule); stroke-width:1.6;
  stroke-dasharray:5 4; stroke-linejoin:round;}
.cm-radar .cm-poly{fill:rgba(201,162,39,.18); stroke:var(--cm-gold); stroke-width:2.4;
  stroke-linejoin:round;}
.cm-radar .cm-vtx circle{fill:var(--cm-gold); stroke:var(--cm-surface); stroke-width:2;
  transition:r .18s ease;}
.cm-radar .cm-lab text{font-family:var(--cm-body); font-size:13px; font-weight:500;
  fill:var(--cm-text);}
.cm-radar .cm-lab tspan{font-family:var(--cm-mono); font-size:12px; fill:var(--cm-mute);}
/* Pointing at one axis raises it in both places at once. Hovering the plot
   marks the row, hovering the row marks the plot: the two are one object. */
.cm-radar .cm-hit{fill:transparent; cursor:default;}
.cm-radar [data-cm-ax].cm-hot circle{r:5.6;}
.cm-radar [data-cm-ax].cm-hot text{fill:var(--cm-acc); font-weight:700;}
.cm-radar [data-cm-ax].cm-hot tspan{fill:var(--cm-acc);}
.cm-vlist > div{transition:background .18s ease;}
.cm-vlist > div.cm-hot{background:rgba(201,162,39,.11);
  box-shadow:inset 3px 0 0 var(--cm-gold);}
.cm-vlist > div{padding-left:9px; margin-left:-9px; border-radius:0 6px 6px 0;}
.cm-vlist .cm-mean{font-family:var(--cm-mono); font-size:12px; color:var(--cm-mute);
  min-width:3.4em; text-align:right;}
.cm-vhead{display:flex; align-items:baseline; gap:14px; padding-bottom:9px;
  font-family:var(--cm-mono); font-size:10.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--cm-mute);}
.cm-vhead span:first-child{flex:1 1 auto;}
.cm-vhead b{font-weight:500; min-width:3.4em; text-align:right;}
/* Legend. Two series, so it is always present. */
.cm-key{display:flex; flex-wrap:wrap; gap:8px 24px; margin:16px 0 0; padding:0;
  list-style:none;}
.cm-key li{font-family:var(--cm-mono); font-size:12px; color:var(--cm-mute);
  display:flex; align-items:center; gap:9px;}
.cm-key i{display:block; width:22px; height:0; border-top:2.4px solid var(--cm-gold);}
.cm-key .cm-k-mean i{border-top:1.6px dashed var(--cm-rule);}
/* The shape opens from the centre once, and only when the script is there to
   close it first. With no script the polygon is already drawn correctly. */
/* The plot opens from its own centre, which each chart states, so one rule
   serves the big radar and the small pair alike. */
.cm-anim .cm-radar .cm-poly,
.cm-anim .cm-radar .cm-mean,
.cm-anim .cm-radar .cm-vtx{
  transform-box:view-box; transform-origin:var(--cm-o,50% 50%);
  transform:scale(.02); opacity:0;
  transition:transform .9s cubic-bezier(.18,.72,.26,1), opacity .55s ease;
}
.cm-anim .cm-radar .cm-mean{transition-delay:.06s;}
.cm-anim .cm-radar .cm-vtx{transition-delay:.16s;}
.cm-anim .cm-radar.cm-drawn .cm-poly,
.cm-anim .cm-radar.cm-drawn .cm-mean,
.cm-anim .cm-radar.cm-drawn .cm-vtx{transform:none; opacity:1;}

.cm-vals{min-width:0;}
.cm-vlist{border-top:1px solid var(--cm-line);}
.cm-vlist > div{display:flex; align-items:baseline; gap:14px; padding:10px 0;
  border-bottom:1px solid var(--cm-line);}
.cm-vlist span{flex:1 1 auto; font-size:14px; color:var(--cm-text);}
.cm-vlist b{font-weight:600; font-size:15px; font-variant-numeric:tabular-nums;
  color:var(--cm-text);}
.cm-vals .cm-small{margin-top:14px;}

.cm-bars{margin-top:18px; border-top:1px solid var(--cm-line);}
.cm-bar{display:grid; grid-template-columns:minmax(0,15em) minmax(0,1fr) 3em;
  align-items:center; gap:16px; padding:11px 0; border-bottom:1px solid var(--cm-line);}
.cm-bar > span{font-size:14px; color:var(--cm-text); min-width:0;}
/* The bar runs in a track, so the comparison mark can be placed against the
   full scale rather than against the bar's own end. */
.cm-track{position:relative; height:10px;}
.cm-bar i{display:block; height:10px; width:var(--w); border-radius:999px;
  background:var(--cm-gold); opacity:.88;}
.cm-bar .cm-mk{position:absolute; top:-5px; bottom:-5px; left:var(--m); width:2px;
  background:var(--cm-navy); border-radius:1px;
  /* 막대 위에 얹히는 구간이 있어 흰 테를 두른다. 회색이면 금색 위에서
     사라지고, 사라지는 기준선은 없는 것과 같다. */
  box-shadow:0 0 0 1.5px var(--cm-surface);}
.cm-bar b{font-weight:600; font-size:14.5px; text-align:right;
  font-variant-numeric:tabular-nums; color:var(--cm-mute);}
@media (max-width:620px){
  .cm-bar{grid-template-columns:minmax(0,1fr) 3em; gap:4px 12px;}
  .cm-bar .cm-track{grid-column:1 / -1;}
}
/* The bars grow in place, one after another, from a zero that the script
   sets. In the stylesheet alone they would be zero for a reader with no
   script and the section would look empty. */
.cm-anim .cm-bars .cm-bar i{width:0; transition:width .78s cubic-bezier(.2,.75,.3,1);}
.cm-anim .cm-bars .cm-bar .cm-mk{opacity:0; transition:opacity .4s ease .5s;}
.cm-anim .cm-bars.cm-in-view .cm-bar .cm-mk{opacity:1;}
.cm-anim .cm-bars.cm-in-view .cm-bar i{width:var(--w);}
.cm-bar:nth-child(1) i{transition-delay:.02s}  .cm-bar:nth-child(2) i{transition-delay:.07s}
.cm-bar:nth-child(3) i{transition-delay:.12s}  .cm-bar:nth-child(4) i{transition-delay:.17s}
.cm-bar:nth-child(5) i{transition-delay:.22s}  .cm-bar:nth-child(6) i{transition-delay:.27s}
.cm-bar:nth-child(7) i{transition-delay:.32s}  .cm-bar:nth-child(8) i{transition-delay:.37s}
.cm-bar:nth-child(9) i{transition-delay:.42s}  .cm-bar:nth-child(10) i{transition-delay:.47s}

/* ── Accordion. A page of questions reads as a wall when every answer is open
   at once, and a table of questions reads as a specification. The summary is
   the control, so it gets the pointer and the whole row as a hit area. */
.cm-acc{margin-top:22px; border-top:1px solid var(--cm-line);}
.cm-acc details{border-bottom:1px solid var(--cm-line);}
.cm-acc summary{list-style:none; cursor:pointer; display:flex; gap:18px;
  align-items:flex-start; padding:19px 2px; font-weight:600; font-size:16px;
  color:var(--cm-text); transition:color .18s;}
.cm-acc summary::-webkit-details-marker{display:none;}
.cm-acc summary:hover{color:var(--cm-acc);}
.cm-acc summary span{flex:1 1 auto;}
.cm-acc summary i{flex:0 0 auto; width:22px; height:22px; margin-top:2px;
  border-radius:50%; border:1px solid var(--cm-rule); position:relative;
  transition:transform .28s cubic-bezier(.2,.7,.3,1), border-color .2s, background .2s;}
.cm-acc summary i::before,.cm-acc summary i::after{content:""; position:absolute;
  left:50%; top:50%; background:var(--cm-text); transform:translate(-50%,-50%);}
.cm-acc summary i::before{width:9px; height:1.5px;}
.cm-acc summary i::after{width:1.5px; height:9px; transition:opacity .2s;}
.cm-acc details[open] summary i{transform:rotate(180deg); border-color:var(--cm-gold);
  background:rgba(201,162,39,.14);}
.cm-acc details[open] summary i::after{opacity:0;}
.cm-acc .cm-ans{overflow:hidden;}
.cm-acc .cm-ans p{margin:0 0 17px; padding-right:40px; font-size:14.5px;
  color:var(--cm-mute); max-width:74ch;}
.cm-anim .cm-acc details[open] .cm-ans{animation:cm-open .34s cubic-bezier(.2,.7,.3,1);}
@keyframes cm-open{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;}}

/* ── Timeline. Four steps in a row of boxes are four boxes; on a rail they
   are a sequence, which is the one thing the reader needs to take from it. */
.cm-time{margin-top:26px; position:relative; display:grid; gap:0;}
.cm-time::before{content:""; position:absolute; left:15px; top:10px; bottom:26px;
  width:2px; background:linear-gradient(180deg,var(--cm-gold),var(--cm-line));}
.cm-tstep{position:relative; padding:0 0 30px 52px;}
.cm-tstep:last-child{padding-bottom:0;}
.cm-tstep::before{content:""; position:absolute; left:8px; top:6px; width:16px; height:16px;
  border-radius:50%; background:var(--cm-surface); border:2px solid var(--cm-gold);}
.cm-tstep b{display:block; font-family:var(--cm-disp); font-weight:700; font-size:17px;
  letter-spacing:-.02em; color:var(--cm-text); margin-bottom:5px;}
.cm-tstep em{display:block; font-style:normal; font-size:11px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--cm-acc); font-weight:600; margin-bottom:7px;}
.cm-tstep p{margin:0; font-size:14.5px; color:var(--cm-mute); max-width:62ch;}

/* ── Layer stack. The point of the section is that one layer is wide and the
   next is narrower, so the widths carry it and the words only confirm it. */
.cm-stack{margin-top:24px; display:grid; gap:12px;}
.cm-layer{border:1px solid var(--cm-line); border-radius:var(--cm-r);
  padding:24px 26px 26px; background:var(--cm-surface); box-shadow:var(--cm-lift);
  transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s;}
.cm-layer:nth-child(1){width:100%;}
.cm-layer:nth-child(2){width:88%;}
.cm-layer:nth-child(3){width:76%;}
@media (max-width:760px){.cm-layer{width:100%!important;}}
@media (hover:hover){.cm-layer:hover{transform:translateX(6px);
  box-shadow:0 2px 4px rgba(15,27,45,.04), 0 20px 44px rgba(15,27,45,.10);}}
.cm-layer:nth-child(1){border-left:3px solid var(--cm-gold);}
.cm-layer h3{margin:0 0 4px;}
.cm-layer ul{margin:12px 0 0; padding:0; list-style:none; columns:2; column-gap:30px;}
@media (max-width:640px){.cm-layer ul{columns:1;}}
.cm-layer li{font-size:14px; color:var(--cm-mute); padding-left:15px; position:relative;
  line-height:1.8; break-inside:avoid;}
.cm-layer li::before{content:""; position:absolute; left:1px; top:12px; width:5px; height:5px;
  border-radius:50%; background:var(--cm-rule);}
.cm-reach{margin-top:12px; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--cm-acc); font-weight:600;}

/* ── Stat tiles. Development figures are the point of that section, so they
   are allowed to be the largest thing in it. */
.cm-tiles{display:grid; gap:14px; margin-top:24px;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
.cm-tile{border:1px solid var(--cm-line); border-radius:var(--cm-r);
  padding:24px 22px 22px; background:var(--cm-surface); box-shadow:var(--cm-lift);
  transition:transform .28s cubic-bezier(.2,.7,.3,1), border-color .28s;}
@media (hover:hover){.cm-tile:hover{transform:translateY(-3px); border-color:var(--cm-rule);}}
.cm-tile b{display:block; font-family:var(--cm-disp); font-weight:700;
  font-size:clamp(26px,3vw,34px); line-height:1.05; letter-spacing:-.04em;
  color:var(--cm-text); font-variant-numeric:tabular-nums;}
.cm-tile span{display:block; margin-top:8px; font-size:13.5px; color:var(--cm-text);}
.cm-tile em{display:block; margin-top:5px; font-style:normal; font-size:12.5px;
  color:var(--cm-mute);}

/* ── Try one item. Reading that the scale is five points is not the same as
   pressing one. The readout says what that single answer feeds, which is the
   whole structure of the instrument in one gesture. */
.cm-try{margin-top:22px; border:1px solid var(--cm-line); border-radius:var(--cm-r);
  background:var(--cm-surface2); padding:26px 26px 24px;}
.cm-try > p{margin:0 0 6px; font-size:11px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--cm-acc); font-weight:600;}
.cm-try q{display:block; font-size:clamp(17px,1.9vw,21px); line-height:1.5;
  letter-spacing:-.02em; color:var(--cm-text); quotes:none; margin-bottom:20px;}
.cm-scale{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(112px,1fr));}
.cm-scale button{font:inherit; font-size:13px; font-weight:500; cursor:pointer;
  padding:14px 8px; border-radius:var(--cm-r2); border:1px solid var(--cm-line);
  background:var(--cm-surface); color:var(--cm-mute);
  transition:border-color .2s, color .2s, transform .2s, background .2s;}
.cm-scale button:hover{border-color:var(--cm-rule); color:var(--cm-text);}
.cm-scale button[aria-pressed="true"]{border-color:var(--cm-gold); color:var(--cm-text);
  background:rgba(201,162,39,.12); font-weight:600;}
.cm-try-out{margin-top:18px; min-height:1px;}
.cm-try-out[hidden]{display:none;}
.cm-anim .cm-try-out:not([hidden]){animation:cm-open .38s cubic-bezier(.2,.7,.3,1);}
.cm-try-out div{display:flex; gap:12px; align-items:baseline; padding:11px 0;
  border-top:1px solid var(--cm-line); font-size:14px; color:var(--cm-mute);}
.cm-try-out div b{font-weight:600; color:var(--cm-text); flex:0 0 11em;}
.cm-try-note{margin-top:14px; font-size:13px; color:var(--cm-mute);}

/* ── The closing band. Every page ends somewhere; without this it ends in a
   footnote, and the reader who was ready to write to us has to go looking
   for the menu. */
.cm-cta-band{border-radius:var(--cm-r); padding:44px 44px 46px; margin-top:0;
  background:linear-gradient(140deg,#16273C 0%,#0F1B2D 62%,#0C1726 100%);
  position:relative; overflow:hidden; isolation:isolate;}
.cm-cta-band::after{content:""; position:absolute; z-index:-1; top:-60%; right:-12%;
  width:min(620px,80%); aspect-ratio:1; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(201,162,39,.22) 0%, transparent 66%);}
.cm-cta-band h2{font-family:var(--cm-disp); font-weight:700;
  font-size:clamp(23px,2.9vw,33px); line-height:1.2; letter-spacing:-.035em;
  color:#E8EDF2; margin:0 0 13px; max-width:19ch; text-wrap:balance;}
.cm-cta-band p{margin:0; font-size:15px; line-height:1.75; color:#B9C6D4; max-width:56ch;}
.cm-cta-band .cm-cta{margin-top:26px;}
.cm-cta-band .cm-btn.cm-ghost{color:#E8EDF2; border-color:#3A5170;}
@media (max-width:620px){.cm-cta-band{padding:34px 24px 36px;}}
.cm-cta-list{display:flex; flex-wrap:wrap; gap:8px 26px; margin:24px 0 0; padding:0;
  list-style:none;}
.cm-cta-list li{font-size:13px; color:#8D9CAE; padding-left:19px; position:relative;}
.cm-cta-list li::before{content:""; position:absolute; left:0; top:8px; width:7px; height:7px;
  border-radius:50%; background:var(--cm-gold);}

/* ── The bar that follows the reader down. It only appears once someone has
   read most of a page, and it closes for good once closed: a bar that comes
   back after being dismissed is an argument with the visitor. */
.cm-dock{position:fixed; left:0; right:0; bottom:0; z-index:9000;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:rgba(15,27,45,.96); backdrop-filter:saturate(1.3) blur(10px);
  border-top:1px solid #22354C;
  transform:translateY(120%); transition:transform .4s cubic-bezier(.2,.7,.3,1);}
.cm-dock.cm-up{transform:none;}
.cm-dock-in{max-width:1040px; margin:0 auto; display:flex; align-items:center;
  gap:10px 18px; flex-wrap:wrap;}
.cm-dock b{font-size:14.5px; font-weight:600; color:#E8EDF2; margin-right:auto;}
.cm-dock .cm-btn{padding:10px 20px; font-size:14px;}
.cm-dock button.cm-x{background:none; border:0; cursor:pointer; color:#8D9CAE;
  font:inherit; font-size:20px; line-height:1; padding:6px 4px;}
.cm-dock button.cm-x:hover{color:#E8EDF2;}
@media (max-width:560px){.cm-dock b{flex:1 1 100%; margin-right:0; font-size:13.5px;}}

/* ── Two shapes side by side. */
.cm-mini{max-width:260px; margin:18px 0 4px;}
.cm-vlist.cm-tight > div{padding:7px 0; font-size:13.5px;}
.cm-vlist.cm-tight b{font-size:14px;}
.cm-cell .cm-vlist{border-top:1px solid var(--cm-line);}

/* ── A hairline across the top that fills as the page goes past. It sits
   under whatever the imweb theme fixes up there, which is why it is two
   pixels and no more. */
.cm-prog{position:fixed; left:0; top:0; right:0; height:2px; z-index:9500;
  background:transparent; pointer-events:none;}
.cm-prog i{display:block; height:100%; width:0; background:var(--cm-gold); border-radius:999px;
  transition:width .12s linear;}

/* ── A rule that reads as a drawing sheet's edge rather than a divider:
   a hairline with a short heavier run at its left, like a title block. */
.cm-rule{border:0; height:0; margin:0;
  border-top:1px solid var(--cm-line); position:relative;}
.cm-rule::before{content:""; position:absolute; left:0; top:-1.5px;
  width:54px; border-top:3px solid var(--cm-gold);}

/* ── Printed. The audience for this site reads it and hands it to a head of
   department, and some of them hand over paper. Backgrounds and the things
   that only work with a pointer come off; nothing that carries meaning does. */
@media print{
  .cm-dock, .cm-prog, .cm-sl-head, .cm-sl-dots, .cm-sl-rail, .cm-tabs{display:none!important;}
  .cm{padding:18px 0!important; background:#fff!important; color:#000!important;
    background-image:none!important;}
  .cm.cm-dark, .cm.cm-tint{--cm-bg:#fff; --cm-surface:#fff; --cm-surface2:#fff;
    --cm-text:#000; --cm-mute:#333; --cm-line:#bbb; --cm-rule:#888; --cm-acc:#000;}
  .cm-cta-band{background:#fff!important; border:1px solid #bbb;}
  .cm-cta-band h2, .cm-cta-band p{color:#000!important;}
  .cm-sl-track{display:block!important; overflow:visible!important;}
  .cm-slide{break-inside:avoid; page-break-inside:avoid; margin-bottom:10px;}
  .cm-radar[hidden]{display:block!important;}
  .cm-vlist[hidden]{display:block!important;}
  .cm-try-out[hidden]{display:block!important;}
  .cm-anim .cm-rise{opacity:1!important; transform:none!important;}
  .cm-anim .cm-radar .cm-poly, .cm-anim .cm-radar .cm-mean,
  .cm-anim .cm-radar .cm-vtx{transform:none!important; opacity:1!important;}
  .cm-anim .cm-bars .cm-bar i{width:var(--w)!important;}
  .cm-cell, .cm-tile, .cm-tw, .cm-note, .cm-layer{break-inside:avoid; page-break-inside:avoid;}
}

/* ── World map. The dots are Natural Earth 110m land geometry sampled every
   3.2 degrees, so the coastlines are real. Antarctica is dropped, which is the
   usual convention and keeps the bottom from becoming a band. */
/* 지도는 본문 측정폭보다 넓게 나간다. 1040 안에 가두면 대륙이 엄지손톱만
   해지는데, 이 절에서 독자가 하는 일은 읽는 것이 아니라 어디에 점이 있나
   보는 것이다. 제목과 문단은 그대로 본문 폭에 남는다 — 넓힐 것은 그림뿐이다. */
.cm-mapwrap{margin-top:30px;}
@media (min-width:1140px){
  .cm-mapwrap{
    --cm-mw:min(1640px, calc(100vw - 48px));
    width:var(--cm-mw); margin-left:calc(50% - var(--cm-mw) / 2);
  }
}
.cm-map{display:block; width:100%; height:auto; overflow:visible;}
/* 점을 키우고 진하게. 2.1 은 1040 폭에서 정한 값인데 이제 1400 까지 간다.
   r 을 CSS 로 주면 생성기를 건드리지 않고 한 줄로 끝나고, 이 속성을 모르는
   브라우저는 마크업에 적힌 2.1 을 그대로 쓴다. */
.cm-map defs circle{r:3.2;}
.cm-map-land use{fill:var(--cm-rule); opacity:.88;}
/* The graticule. A world map without one is a shape; with one it states its
   projection, and the projection is written under it. */
.cm-grat line{stroke:var(--cm-line); stroke-width:1; opacity:.62;}
.cm-grat .cm-eq{stroke:var(--cm-rule); stroke-width:1; opacity:.8;}
.cm-proj{font-family:var(--cm-mono); font-size:12px; letter-spacing:.03em;
  color:var(--cm-mute); margin:16px 0 0;}
.cm-pin text{font-family:var(--cm-body); font-size:20px; font-weight:600;
  fill:var(--cm-text); paint-order:stroke; dominant-baseline:middle;}
.cm-pin .cm-pin-dot{fill:var(--cm-mute);}
.cm-pin .cm-pin-halo{fill:none;}
.cm-pin-legal .cm-pin-dot{fill:var(--cm-text);}
.cm-pin-src .cm-pin-dot{fill:var(--cm-gold);}
.cm-pin-src .cm-pin-halo{fill:var(--cm-gold); opacity:.18;}
/* One pin beats, and only the one the section is about. Ten beating pins
   would be a fairground. */
@keyframes cm-beat{
  0%{r:14; opacity:.30;} 70%{r:30; opacity:0;} 100%{r:30; opacity:0;}
}
.cm-anim .cm-pin-src .cm-pin-halo{animation:cm-beat 2.9s ease-out infinite;}
/* Pins arrive one after another the first time the map is reached. */
.cm-anim .cm-map-pins .cm-pin{opacity:0; transition:opacity .5s ease;}
.cm-anim .cm-map-pins.cm-in-view .cm-pin{opacity:1;}
.cm-pin-src text{fill:var(--cm-text);}
/* 범례는 지도 안에 들어 있지만 읽는 것이라 본문 폭으로 돌려놓는다. 지도가
   1640 까지 가는데 범례가 그 왼쪽 끝에서 시작하면 아래 표와 줄이 어긋나고,
   한 절이 두 개의 왼쪽 선을 갖게 된다. 넓힐 것은 그림뿐이다. */
.cm-legend{list-style:none; margin:20px auto 0; padding:0; display:flex;
  flex-wrap:wrap; gap:10px 26px; max-width:1040px;}
.cm-legend li{font-size:15px; color:var(--cm-mute); position:relative; padding-left:20px;}
.cm-legend li::before{content:""; position:absolute; left:0; top:8px;
  width:12px; height:12px; border-radius:50%; background:var(--cm-mute);}
.cm-legend .cm-lg-src::before{background:var(--cm-gold);}
.cm-legend .cm-lg-legal::before{background:var(--cm-text);}
@media (max-width:760px){
  .cm-map{min-width:680px;}
  .cm-mapwrap{overflow-x:auto;}
  .cm-pin text{font-size:19px;}
}
@media (prefers-reduced-motion:reduce){
  .cm *{transition:none!important; animation:none!important;}
  .cm-sl-track{scroll-behavior:auto;}
  /* Nothing may be left waiting on a transition that will never run. */
  .cm-anim .cm-rise{opacity:1!important; transform:none!important;}
  .cm-anim .cm-sl-img .cm-slide{opacity:1!important;}
  .cm-anim .cm-map-pins .cm-pin{opacity:1!important;}
  .cm-anim .cm-radar .cm-poly, .cm-anim .cm-radar .cm-vtx{transform:none!important; opacity:1!important;}
  .cm-anim .cm-bars .cm-bar i{width:var(--w)!important;}
  .cm-anim .cm-bars .cm-bar .cm-mk{opacity:1!important;}
  .cm-dock{transition:none!important;}
}

/* ── Holding our own ground inside someone else's theme.
   The alarm that brought this in: the two buttons in the opening band came
   out as empty pills on the live site. The shapes were right and the widths
   differed with the label lengths, so the text was laid out and then not
   painted. Themes do that on purpose — a gradient headline is made by
   clipping the background to the glyphs and setting the fill to transparent —
   and a rule written for the theme's own links reaches ours too.

   currentColor puts the fill back wherever the colour is, whatever rule set
   it to transparent, and the two buttons name their colour again so nothing
   downstream can take that away either. !important is not a habit; a host
   stylesheet loading after ours is the case it exists for. */
/* ── Taking the full width back from whatever column we were dropped into.

   The host's editor puts a code widget inside a section, and that section
   carries the theme's own content width. Our bands are meant to run edge to
   edge and set their own measure inside, so in a narrow column the whole
   site arrives as a strip down the middle of a white page.

   The margins pull the band out to the viewport from wherever its container
   starts. When the container is already full width, 50% and half the
   viewport are the same number and both margins come out at zero, so this
   costs nothing in the case where the section was set correctly. That is
   why it can be the default rather than a class someone has to remember.

   100vw counts the scrollbar, so on a platform that reserves space for one
   this would overshoot by its width and put a horizontal scrollbar on every
   page. The script at the end of this block measures that gap once and
   writes it into --cm-sbw; until it runs the fallback is 0, which is right
   for overlay scrollbars and off by a few pixels for a moment elsewhere. */
.cm{
  --cm-vw:calc(100vw - var(--cm-sbw, 0px));
  width:var(--cm-vw);
  max-width:var(--cm-vw);
  margin-left:calc(50% - var(--cm-vw) / 2);
  margin-right:calc(50% - var(--cm-vw) / 2);
}
.cm, .cm *{-webkit-text-fill-color:currentColor !important;}
.cm .cm-btn{color:var(--cm-navy) !important; text-decoration:none !important;
  -webkit-text-fill-color:var(--cm-navy) !important;}
.cm .cm-btn.cm-ghost{color:var(--cm-btn2) !important;
  -webkit-text-fill-color:var(--cm-btn2) !important;}
/* The closing band paints its own dark gradient inside a light section, so
   it is not .cm-dark and its ghost button has to be named on its own. The
   first draft of this patch reached it through .cm.cm-dark, missed, and left
   navy type on a navy band: the same bug it was written to fix. */
.cm-cta-band .cm-btn.cm-ghost{color:#E8EDF2 !important;
  -webkit-text-fill-color:#E8EDF2 !important; border-color:#3A5170 !important;}
.cm-dock .cm-btn{color:var(--cm-navy) !important;
  -webkit-text-fill-color:var(--cm-navy) !important;}
</style>
<script>
/* The scrollbar's width, measured rather than guessed.

   The bands above are pulled out to 100vw, and 100vw includes the scrollbar
   on a platform that reserves room for one. Without this the page gains a
   horizontal scrollbar exactly as wide as the vertical one. innerWidth
   counts it, clientWidth does not, so the difference is the number we want.
   It is re-measured on resize because a page can gain or lose its vertical
   scrollbar as content changes. */
(function () {
  function measure() {
    var gap = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.setProperty("--cm-sbw", (gap > 0 ? gap : 0) + "px");
  }
  measure();
  window.addEventListener("resize", measure);
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", measure);
  }
})();
</script>
<script>
/* Slider wiring. imweb sometimes inserts widgets late, so newly added
   sliders are picked up too. A marker is left so none is wired twice. */
(function () {
  function wire(sl) {
    if (sl.dataset.cmWired) return;
    sl.dataset.cmWired = "1";
    var track = sl.querySelector(".cm-sl-track");
    if (!track) return;
    var prev = sl.querySelector("[data-cm-prev]");
    var next = sl.querySelector("[data-cm-next]");
    var dots = sl.querySelector(".cm-sl-dots");
    var slides = Array.prototype.slice.call(track.children);
    /* Past four slides the dots stop telling anyone where they are, so the
       row is replaced by a rail that fills. Under that, dots are clearer and
       can be aimed at. One or the other, never both. */
    var rail = null;
    if (dots && slides.length > 4) {
      dots.hidden = true;
      rail = document.createElement("div");
      rail.className = "cm-sl-rail";
      rail.appendChild(document.createElement("i"));
      dots.parentNode.insertBefore(rail, dots.nextSibling);
      rail = rail.firstChild;
    }

    function step() {
      var a = slides[0], b = slides[1];
      return b ? b.offsetLeft - a.offsetLeft : (a ? a.offsetWidth : 300);
    }
    function idx() { return Math.round(track.scrollLeft / step()); }
    function go(i) {
      var max = slides.length - 1;
      i = Math.max(0, Math.min(max, i));
      track.scrollTo({ left: slides[i] ? slides[i].offsetLeft - slides[0].offsetLeft : 0 });
    }
    if (prev) prev.addEventListener("click", function () { go(idx() - 1); });
    if (next) next.addEventListener("click", function () { go(idx() + 1); });

    if (dots && !rail) {
      slides.forEach(function (_, i) {
        var d = document.createElement("button");
        d.type = "button";
        d.className = "cm-sl-dot";
        d.setAttribute("aria-label", "Go to slide " + (i + 1));
        d.addEventListener("click", function () { go(i); });
        dots.appendChild(d);
      });
    }
    track.setAttribute("tabindex", "0");
    track.setAttribute("role", "group");
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); go(idx() + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(idx() - 1); }
    });

    function sync() {
      var atStart = track.scrollLeft <= 2;
      var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
      if (prev) prev.disabled = atStart;
      if (next) next.disabled = atEnd;
      var i = idx();
      if (dots && !rail) {
        Array.prototype.forEach.call(dots.children, function (d, k) {
          d.setAttribute("aria-current", k === i ? "true" : "false");
        });
      }
      if (rail) rail.style.width = ((i + 1) / slides.length * 100) + "%";
      slides.forEach(function (sd, k) { sd.classList.toggle("cm-here", k === i); });
    }
    track.addEventListener("scroll", sync, { passive: true });
    window.addEventListener("resize", sync);
    sync();

    /* Drag with a mouse or a trackpad, on image sliders only. On a text
       slide the same gesture is how someone selects a line, so taking it
       over there would break selection to gain nothing. Touch already
       scrolls natively and is left alone. */
    if (sl.classList.contains("cm-sl-img")) {
      var down = false, startX = 0, startLeft = 0, moved = false;
      track.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "touch") return;
        down = true; moved = false;
        startX = e.clientX; startLeft = track.scrollLeft;
        /* Snapping has to come off for the duration. Mandatory snap pulls the
           scroll position back to the nearest slide after every write, so a
           drag made of small steps never leaves the slide it started on. */
        track.style.scrollSnapType = "none";
        track.style.scrollBehavior = "auto";
      });
      track.addEventListener("pointermove", function (e) {
        if (!down) return;
        var d = e.clientX - startX;
        if (Math.abs(d) > 3) moved = true;
        track.scrollLeft = startLeft - d;
      });
      function release() {
        if (!down) return;
        down = false;
        track.style.scrollSnapType = "";
        track.style.scrollBehavior = "";
        if (moved) go(idx());
      }
      track.addEventListener("pointerup", release);
      track.addEventListener("pointercancel", release);
      track.addEventListener("pointerleave", release);
      track.addEventListener("dragstart", function (e) { e.preventDefault(); });
    }

    /* Advance on its own, if the section asks for it with data-cm-auto.
       It stops under the pointer, while anything inside has focus, and on a
       hidden tab: a slide that moves while it is being read is worse than
       one that never moves. Reduced motion turns it off entirely. */
    var every = parseInt(sl.getAttribute("data-cm-auto") || "0", 10);
    var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (every >= 2000 && slides.length > 1 && !still) {
      var timer = null;
      var stop = function () { if (timer) { clearInterval(timer); timer = null; } };
      var start = function () {
        stop();
        timer = setInterval(function () {
          var i = idx();
          go(i >= slides.length - 1 ? 0 : i + 1);
        }, every);
      };
      sl.addEventListener("mouseenter", stop);
      sl.addEventListener("mouseleave", start);
      sl.addEventListener("focusin", stop);
      sl.addEventListener("focusout", start);
      sl.addEventListener("pointerdown", stop);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { stop(); } else { start(); }
      });
      start();
    }
  }
  function scan() { document.querySelectorAll(".cm-sl").forEach(wire); }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else { scan(); }
  if (window.MutationObserver) {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script>
/* The two profiles behind one chart.
   Without this the first profile is the one on the page and the second is
   hidden, which is still a correct page: the figures beside the shape are
   what a reader actually reads off, and both lists are in the markup. */
(function () {
  function wire(tabs) {
    if (tabs.dataset.cmWired) return;
    tabs.dataset.cmWired = "1";
    var scope = tabs.closest(".cm-in") || document;
    var btns = Array.prototype.slice.call(tabs.querySelectorAll("[data-cm-tab]"));

    function pick(key) {
      btns.forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.cmTab === key ? "true" : "false");
      });
      scope.querySelectorAll("[data-cm-vals]").forEach(function (v) {
        v.hidden = v.dataset.cmVals !== key;
      });
      scope.querySelectorAll("[data-cm-radar]").forEach(function (r) {
        var on = r.dataset.cmRadar === key;
        r.hidden = !on;
        /* Redrawn each time it is brought back, so switching profiles shows
           the shape being made rather than swapping one picture for another. */
        if (on) {
          r.classList.remove("cm-drawn");
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { r.classList.add("cm-drawn"); });
          });
        }
      });
    }
    btns.forEach(function (b, i) {
      b.addEventListener("click", function () { pick(b.dataset.cmTab); });
      b.addEventListener("keydown", function (e) {
        var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        var nx = btns[(i + d + btns.length) % btns.length];
        nx.focus(); pick(nx.dataset.cmTab);
      });
    });
  }

  /* One sample item that can actually be answered. The readout is not a score:
     a single item cannot produce one, and pretending otherwise would be the
     first lie the site tells. It says what that answer feeds. */
  function wireTry(box) {
    if (box.dataset.cmWired) return;
    box.dataset.cmWired = "1";
    var out = box.querySelector(".cm-try-out");
    var btns = Array.prototype.slice.call(box.querySelectorAll("[data-cm-pick]"));
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        btns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
        if (!out) return;
        out.hidden = false;
        out.querySelectorAll("[data-cm-answer]").forEach(function (el) {
          el.textContent = b.dataset.cmPick;
        });
      });
    });
  }

  /* The bar that follows the reader down. Shown once most of a page has gone
     past, closed for good when closed: it remembers in this browser only, and
     a browser that refuses to remember simply shows it again next visit. */
  function wireDock(dock) {
    if (dock.dataset.cmWired) return;
    dock.dataset.cmWired = "1";
    var KEY = "cm-dock-closed";
    try { if (localStorage.getItem(KEY) === "1") { dock.remove(); return; } } catch (e) {}
    var x = dock.querySelector(".cm-x");
    if (x) x.addEventListener("click", function () {
      dock.classList.remove("cm-up");
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      setTimeout(function () { dock.remove(); }, 420);
    });
    var tick = function () {
      /* Which element actually scrolls is not always the same one: a page
         without a doctype scrolls its body and reports 0 on documentElement,
         and then the bar never appears. scrollingElement answers correctly
         in both. */
      var sc = document.scrollingElement || document.documentElement;
      var seen = (sc.scrollTop + window.innerHeight) / Math.max(sc.scrollHeight, 1);
      /* 한 장에 다 들어 있는 페이지에서 55% 는 너무 늦다. 그때쯤이면 이미
         읽을 만큼 읽은 사람이고, 물어볼 마음은 그 전에 생긴다. */
      dock.classList.toggle("cm-up", seen > 0.25);
    };
    window.addEventListener("scroll", tick, { passive: true });
    window.addEventListener("resize", tick);
    tick();
  }

  /* The rail across the top. Built here rather than pasted as a widget: it
     belongs to the page, not to any one section, and one per document is the
     only correct number. */
  function rail() {
    if (document.querySelector(".cm-prog")) return;
    if (!document.querySelector(".cm")) return;
    var bar = document.createElement("div");
    bar.className = "cm-prog";
    bar.setAttribute("aria-hidden", "true");
    var fill = document.createElement("i");
    bar.appendChild(fill);
    document.body.appendChild(bar);
    var tick = function () {
      var sc = document.scrollingElement || document.documentElement;
      var room = sc.scrollHeight - window.innerHeight;
      fill.style.width = (room > 40 ? Math.min(1, sc.scrollTop / room) * 100 : 0) + "%";
    };
    window.addEventListener("scroll", tick, { passive: true });
    window.addEventListener("resize", tick);
    tick();
  }

  /* Pointing at one axis raises it in the plot and in the list at once. */
  function wireAxes(chart) {
    if (chart.dataset.cmWired) return;
    chart.dataset.cmWired = "1";
    var mark = function (i, on) {
      chart.querySelectorAll('[data-cm-ax="' + i + '"]').forEach(function (el) {
        el.classList.toggle("cm-hot", on);
      });
    };
    chart.querySelectorAll("[data-cm-ax]").forEach(function (el) {
      var i = el.dataset.cmAx;
      el.addEventListener("pointerenter", function () { mark(i, true); });
      el.addEventListener("pointerleave", function () { mark(i, false); });
    });
  }

  function scan() {
    rail();
    document.querySelectorAll(".cm-chart").forEach(wireAxes);
    document.querySelectorAll(".cm-tabs").forEach(wire);
    document.querySelectorAll(".cm-try").forEach(wireTry);
    document.querySelectorAll(".cm-dock").forEach(wireDock);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else { scan(); }
  if (window.MutationObserver) {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script>
/* Sections arrive as they are reached, and the specification figures count up
   the first time they are seen.

   The starting state lives behind .cm-anim, and that class is only added once
   this script has an IntersectionObserver to hand. A stylesheet that hides
   blocks up front would leave a reader with broken JavaScript looking at an
   empty page, which is worse than a page that does not move. */
(function () {
  if (!("IntersectionObserver" in window)) return;
  var root = document.documentElement;
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.classList.add("cm-anim");

  function run(el) {
    var figs = el.querySelectorAll ? el.querySelectorAll("[data-cm-count]") : [];
    Array.prototype.forEach.call(figs, function (f) {
      if (f.dataset.cmCounted) return;
      f.dataset.cmCounted = "1";
      var to = Number(f.getAttribute("data-cm-count"));
      /* The element's own text is the real value and is always put back at
         the end, so nothing on the page depends on the animation finishing. */
      var settled = f.textContent;
      if (!isFinite(to) || still) return;
      var t0 = 0;
      requestAnimationFrame(function step(ts) {
        if (!t0) t0 = ts;
        var k = Math.min(1, (ts - t0) / 900);
        var e = 1 - Math.pow(1 - k, 3);
        f.textContent = Math.round(to * e).toLocaleString("en-US");
        if (k < 1) requestAnimationFrame(step); else f.textContent = settled;
      });
    });
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      var wait = still ? 0 : Number(e.target.dataset.cmDelay || 0);
      setTimeout(function () {
        e.target.classList.add("cm-in-view");
        if (e.target.classList.contains("cm-radar")) e.target.classList.add("cm-drawn");
        run(e.target);
      }, wait);
    });
  }, { rootMargin: "0px 0px -7% 0px", threshold: 0.04 });

  function mark(el, delay) {
    if (el.dataset.cmRise) return;
    el.dataset.cmRise = "1";
    el.classList.add("cm-rise");
    if (delay) el.dataset.cmDelay = String(delay);
    io.observe(el);
  }

  function scan() {
    /* Targets are found rather than declared, so a widget added later needs
       no class of its own and the two sites cannot drift apart. */
    document.querySelectorAll(".cm > .cm-in").forEach(function (inner) {
      Array.prototype.forEach.call(inner.children, function (child, i) {
        mark(child, Math.min(i, 4) * 70);
      });
    });
    /* The radar opens from the centre. It is observed on its own rather than
       through its container, so the shape starts drawing when the chart is
       reached and not when the section above it is. */
    document.querySelectorAll(".cm-radar").forEach(function (r) {
      if (r.dataset.cmRise) return;
      r.dataset.cmRise = "1";
      io.observe(r);
    });
    document.querySelectorAll(".cm-map-pins").forEach(function (g) {
      if (g.dataset.cmRise) return;
      g.dataset.cmRise = "1";
      Array.prototype.forEach.call(g.children, function (pin, i) {
        pin.style.transitionDelay = still ? "0ms" : (140 + i * 80) + "ms";
      });
      io.observe(g);
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else { scan(); }
  if (window.MutationObserver) {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
