<!-- Reports · screens. Replace IMG_TEST and IMG_REPORT with your uploads. -->
<div class="cm cm-tint">
  <div class="cm-in">
    <div class="cm-head">
    <h2 class="cm-h2">Screens</h2>
    <div class="cm-col"><p>The sitting, and the report a student receives.</p></div>
    </div>
    <div class="cm-sl">
      <div class="cm-sl-head">
        <p>Swipe through</p>
        <button class="cm-sl-btn" type="button" data-cm-prev aria-label="Previous screen">&#8592;</button>
        <button class="cm-sl-btn" type="button" data-cm-next aria-label="Next screen">&#8594;</button>
      </div>
      <div class="cm-sl-track" aria-label="Two screens">
        <div class="cm-slide"><figure>
          <img src="IMG_TEST" alt="A sitting in progress: five-point items a page at a time.">
          <figcaption>The sitting · answers save as they are made</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_REPORT" alt="Personal report: summary and the ten job areas ranked.">
          <figcaption>Personal report · summary and the ten job areas</figcaption>
        </figure></div>
      </div>
      <div class="cm-sl-dots" aria-hidden="true"></div>
    </div>
    <p class="cm-small cm-col" style="margin-top:14px">Captured from the mechanical
      engineering instrument in English. The figures come from a demonstration sitting,
      not from a real student.</p>
  </div>
</div>
