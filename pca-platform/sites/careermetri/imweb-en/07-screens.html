<!-- Home · the screens, as a slider. It sits on the home page rather than
     under Reports so that the product is visible before the reader has to
     choose a menu.

     Six slides: the sitting, then five sections of one report. Two pictures
     let a reader think the report is two pages; the sections are what makes
     the size of it obvious without a paragraph claiming it.

     Replace IMG_SITTING and the five IMG_REPORT_* with the addresses imweb
     gives your uploads, or paste 07-screens-embedded.html instead, which
     carries the pictures inside it.

     data-cm-auto is the dwell in milliseconds, and it is the only number to
     change if this reads too fast or too slow: 1000 is a second. Two seconds
     over six slides is twelve for the whole run. It stops under the pointer,
     while anything inside has focus, and for a visitor who asked for reduced
     motion, so nobody is dragged past something they are reading. -->
<div class="cm cm-tint">
  <div class="cm-in">
    <div class="cm-head">
    <h2 class="cm-h2">Screens</h2>
    <div class="cm-col"><p>The sitting a student works through, and five
    sections of the report that comes back. Captured in English from the
    mechanical engineering instrument, from one demonstration sitting.</p></div>
    </div>
    <div class="cm-sl cm-sl-img" data-cm-auto="2000">
      <div class="cm-sl-head">
        <p>Drag, swipe or use the arrows</p>
        <button class="cm-sl-btn" type="button" data-cm-prev aria-label="Previous screen">&#8592;</button>
        <button class="cm-sl-btn" type="button" data-cm-next aria-label="Next screen">&#8594;</button>
      </div>
      <div class="cm-sl-track" aria-label="Six screens">
        <div class="cm-slide"><figure>
          <img src="IMG_SITTING" alt="A sitting in progress: five-point items shown a page at a time.">
          <figcaption>The sitting &middot; every answer saves as it is made, so a student can close the tab and come back</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_REPORT_SUMMARY" alt="Report section 00, Summary: the role, job area and work style furthest ahead, with the reliability of the sitting.">
          <figcaption>Report 00 &middot; what stands furthest ahead, and how reliable this particular sitting was</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_REPORT_AREAS" alt="Report section 01, Ten job areas ranked from 77.0 down to 25.0.">
          <figcaption>Report 01 &middot; the ten job areas inside the discipline, which is what the items measure directly</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_REPORT_AXES" alt="Report section 02: the eight engineering activity axes drawn as a radar.">
          <figcaption>Report 02 &middot; the eight activity axes. Area names differ by country; these do not</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_REPORT_ROLES" alt="Report section 04, Role fit: roles in three groups with a margin bar on each.">
          <figcaption>Report 04 &middot; roles in groups, not a ranking. The thin bar is the margin we cannot see past</figcaption>
        </figure></div>
        <div class="cm-slide"><figure>
          <img src="IMG_REPORT_NEXT" alt="Report section 06, The next six months, in three two-month steps.">
          <figcaption>Report 06 &middot; what to do next, in three steps, against the role furthest ahead</figcaption>
        </figure></div>
      </div>
      <div class="cm-sl-dots" aria-hidden="true"></div>
    </div>
    <p class="cm-small cm-col" style="margin-top:14px">The figures come from a
      demonstration sitting, not from a real student.</p>
  </div>
</div>
