<!-- The bar that follows the reader down the page. Paste it once per page,
     anywhere: it is fixed to the bottom of the window, not to its place in
     the document.

     It appears only after 55% of a page has gone past, so it never greets
     someone who has read nothing, and it closes for good when closed. A bar
     that comes back after being dismissed is an argument with the visitor.
     Change href="/contact" to the real contact page address. -->
<div class="cm-dock" role="complementary" aria-label="Enquiry">
  <div class="cm-dock-in">
    <b>Wondering what your own cohort would look like?</b>
    <a class="cm-btn" href="/contact">Talk to us</a>
    <button type="button" class="cm-x" aria-label="Close this bar">&times;</button>
  </div>
</div>
