<!-- ═══════════════════════════════════════════════════════════
     Careermetri · international site
     imweb · Settings > SEO > (scroll down) Common code > Header Code

     Paste this block once. It applies to every page.

     Every selector is namespaced cm-. Grabbing body, section or h2
     directly would restyle the imweb theme along with our sections.

     Identical to the Korean head code. One design system, two sites.
     ═══════════════════════════════════════════════════════════ -->
<!-- Two font links. Pretendard first (a variable font with a dynamic subset,
     so only the glyphs in use are fetched), Noto Sans KR second as the loaded
     fallback. The fallback only downloads on a day the first one fails: an
     unused @font-face never fetches its files. Same stack as the Korean site,
     so both read as one system. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --cm-navy:#0F1B2D; --cm-gold:#C9A227;
  --cm-bg:#FFFFFF; --cm-surface:#FFFFFF; --cm-surface2:#F2F4F7;
  --cm-text:#0F1B2D; --cm-mute:#4F6076;
  --cm-line:#E4E9EF; --cm-rule:#C3CCD8;
  --cm-acc:#7A6214; --cm-btn2:#0F1B2D;
  /* Every corner is rounded. Nothing on this site is square. */
  --cm-r:24px; --cm-r2:16px; --cm-r3:3px; --cm-pill:999px;
  /* One very shallow shadow on raised surfaces. A border alone reads flat,
     and a heavy shadow reads like an old card. */
  --cm-lift:0 1px 2px rgba(15,27,45,.035), 0 12px 34px rgba(15,27,45,.06);
  /* One typeface only. Headings, body and figures from different families
     stop reading as one page. Figures line up with tabular-nums rather than
     by switching to a second font. */
  --cm-body:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,
    BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --cm-disp:var(--cm-body); --cm-mono:var(--cm-body);
}
.cm.cm-tint{--cm-bg:#F2F4F7; --cm-surface:#F2F4F7; --cm-surface2:#FFFFFF;}
.cm.cm-dark{
  /* A flat fill of one navy over 900 pixels reads as a printed block. The
     gradient is shallow enough that nobody sees a gradient. */
  background-image:linear-gradient(178deg,#132134 0%,#0F1B2D 46%,#0C1726 100%);
  --cm-bg:#0F1B2D; --cm-surface:#0F1B2D; --cm-surface2:#16273C;
  --cm-text:#E8EDF2; --cm-mute:#8D9CAE;
  --cm-line:#22354C; --cm-rule:#2E4460;
  --cm-acc:#C9A227; --cm-btn2:#C9A227;
}

.cm{
  background:var(--cm-bg); color:var(--cm-text);
  font-family:var(--cm-body); font-size:16px; line-height:1.78;
  letter-spacing:-.011em; word-break:keep-all; overflow-wrap:break-word;
  padding:92px 20px; margin:0;
}
.cm *{box-sizing:border-box;}
/* Every section starts on the same vertical line. Different widths per
   section make the left edge wobble as the page scrolls. */
.cm-in{max-width:1040px; margin:0 auto;}
/* Section head: the heading holds the left column, the opening paragraph the
   right. In one column the text measure leaves the right side empty on every
   section, which reads as unfinished rather than composed. */
.cm-head{display:grid; gap:14px 56px; align-items:start; margin-bottom:26px;}
@media (min-width:900px){
  .cm-head{grid-template-columns:minmax(0,7fr) minmax(0,9fr);}
  .cm-head > .cm-h2{margin:0; padding-top:2px;}
  .cm-head > .cm-col{max-width:none;}
  .cm-head > .cm-col > p:last-child{margin-bottom:0;}
}
.cm-col{max-width:660px;}
.cm img{max-width:100%; display:block;}
.cm a{color:var(--cm-text);}
.cm strong{font-weight:600;}
.cm :focus-visible{outline:2px solid var(--cm-acc); outline-offset:3px;}

/* Headings are short noun phrases. A sentence per section reads as ad copy. */
.cm-h2{
  font-family:var(--cm-disp); font-weight:700; font-size:clamp(25px,3.1vw,36px);
  line-height:1.26; letter-spacing:-.035em; margin:0 0 14px; color:var(--cm-text);
  text-wrap:balance;
}
.cm-h3{font-family:var(--cm-disp); font-weight:700; font-size:16px; margin:0 0 7px; color:var(--cm-text);}
.cm-sublabel{
  font-family:var(--cm-body); font-weight:600; font-size:15px; color:var(--cm-text);
  margin:48px 0 14px; padding-top:16px; border-top:1px solid var(--cm-line);
}
.cm p{margin:0 0 15px;}
.cm-sub{color:var(--cm-mute);}
.cm-small{font-size:13.5px; color:var(--cm-mute); line-height:1.75;}

.cm-h1{
  font-family:var(--cm-disp); font-weight:700; font-size:clamp(33px,5.4vw,60px);
  line-height:1.12; letter-spacing:-.042em; margin:0 0 20px; color:var(--cm-text);
  max-width:17ch; text-wrap:balance;
}
@media (max-width:760px){.cm-h1{max-width:none;}}
.cm-cta{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px;}
.cm-btn{
  font-family:var(--cm-body); font-weight:600; font-size:15px; padding:12px 24px;
  text-decoration:none; display:inline-block; border-radius:var(--cm-pill);
  border:1px solid var(--cm-gold); color:var(--cm-navy); background:var(--cm-gold);
}
.cm-btn{transition:transform .2s cubic-bezier(.2,.7,.3,1), background .2s, border-color .2s, box-shadow .2s;}
.cm-btn.cm-ghost{background:transparent; color:var(--cm-btn2); border-color:var(--cm-rule);}
.cm-btn:hover{background:#B38E1C; border-color:#B38E1C; transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(201,162,39,.28);}
.cm-btn.cm-ghost:hover{background:rgba(201,162,39,.14); border-color:var(--cm-gold);
  box-shadow:none;}
.cm-btn:active{transform:translateY(0);}

/* Specification tables. The most used container on this site. */
.cm-tw{overflow-x:auto; margin:20px 0 0; border:1px solid var(--cm-line);
  border-radius:var(--cm-r); background:var(--cm-surface);}
.cm-tw table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:440px;}
.cm-tw th,.cm-tw td{text-align:left; padding:16px 20px; border-bottom:1px solid var(--cm-line);}
.cm-tw tr:last-child th,.cm-tw tr:last-child td{border-bottom:0;}
/* Head cells were filled grey and row labels filled grey again, which made
   every table look like a form from a decade ago. A small capitalised label
   over a single rule does the same job and lets the figures carry the block. */
.cm-tw thead th{font-family:var(--cm-body); font-size:11px; color:var(--cm-mute);
  font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  padding-top:18px; padding-bottom:12px;
  background:transparent; border-bottom:1px solid var(--cm-rule);}
.cm-tw td{color:var(--cm-mute); vertical-align:top;}
.cm-tw td.cm-name,.cm-tw th[scope=row]{color:var(--cm-text); font-weight:600; white-space:nowrap;}
.cm-tw th[scope=row]{background:transparent; width:10.5em; vertical-align:top;
  font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--cm-mute); font-weight:600; padding-top:19px;}
.cm-tw td.cm-live{color:var(--cm-acc); font-weight:600; white-space:nowrap;}
.cm-tw .cm-num{text-align:right;}
.cm-tw td.cm-num{font-variant-numeric:tabular-nums;}
@media (max-width:540px){.cm-tw th[scope=row]{width:7.5em; font-size:13px;}}

/* Cells stand apart. Butted together on a 1px rule they set into one table. */
.cm-grid{display:grid; gap:16px; margin-top:22px;}
.cm-g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.cm-g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.cm-cell{background:var(--cm-surface); padding:28px 26px 30px;
  border:1px solid var(--cm-line); border-radius:var(--cm-r); box-shadow:var(--cm-lift);
  transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s, border-color .28s;}
@media (hover:hover){
  .cm-cell:hover{transform:translateY(-3px); border-color:var(--cm-rule);
    box-shadow:0 2px 4px rgba(15,27,45,.04), 0 22px 48px rgba(15,27,45,.10);}
}
.cm-n{font-family:var(--cm-body); font-weight:600; font-size:12.5px; color:var(--cm-acc);
  display:block; margin-bottom:9px;}
.cm-cell p{margin:0; font-size:14.5px; color:var(--cm-mute); line-height:1.75;}
.cm-cell ul{margin:9px 0 0; padding:0; list-style:none;}
.cm-cell li{font-size:14.5px; color:var(--cm-mute); padding-left:15px;
  position:relative; line-height:1.8;}
.cm-cell li::before{content:""; position:absolute; left:1px; top:13px;
  width:5px; height:5px; border-radius:50%; background:var(--cm-rule);}

/* The report is a white document. A mount and a hairline put it on a desk. */
.cm-plate{margin:26px 0 0; background:var(--cm-surface2); padding:16px;
  border:1px solid var(--cm-line); border-radius:var(--cm-r); box-shadow:var(--cm-lift);}
.cm-plate img{border:1px solid var(--cm-rule); border-radius:var(--cm-r2);}
.cm-plate figcaption{font-size:12.5px; color:var(--cm-mute); padding:11px 2px 1px;}

/* Rows that quote an item verbatim. */
.cm-items{margin-top:18px; display:grid; gap:9px;}
.cm-item{background:var(--cm-surface2); border:1px solid var(--cm-line);
  border-left:3px solid var(--cm-gold); border-radius:var(--cm-r);
  padding:16px 20px; font-size:14.5px; line-height:1.72;}
.cm-item b{display:block; font-size:12.5px; color:var(--cm-acc);
  margin-bottom:4px; font-weight:600;}

/* The only place a number means something: steps taken in order. */
.cm-steps{counter-reset:cmstep; display:grid; gap:10px; margin-top:22px;}
.cm-step{background:var(--cm-surface); padding:18px 24px; display:flex; gap:14px;
  align-items:baseline; border:1px solid var(--cm-line); border-radius:var(--cm-r2);}
.cm-step::before{counter-increment:cmstep; content:counter(cmstep,decimal-leading-zero);
  font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums;
  color:var(--cm-acc); flex:0 0 auto;}
.cm-step b{font-weight:600; flex:0 0 11em;}
.cm-step span{color:var(--cm-mute); font-size:14.5px;}
@media (max-width:540px){
  .cm-step{flex-wrap:wrap; gap:5px 14px;}
  .cm-step b{flex:0 0 auto;}
  .cm-step span{flex:1 1 100%; padding-left:26px;}
}

.cm-packs{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); margin-top:20px;}
.cm-pack{border:1px solid var(--cm-line); border-radius:var(--cm-r);
  padding:28px 26px; background:var(--cm-surface); box-shadow:var(--cm-lift);}
.cm-pack.cm-pick{border-color:var(--cm-gold); border-top:3px solid var(--cm-gold);
  background:var(--cm-surface2);}
.cm-tag{font-weight:600; font-size:12.5px; color:var(--cm-acc); display:block; margin-bottom:10px;}
.cm-price{font-family:var(--cm-disp); font-weight:700; font-size:25px;
  margin:0 0 5px; letter-spacing:-.03em; color:var(--cm-text);
  font-variant-numeric:tabular-nums;}
.cm-unit{font-size:13px; color:var(--cm-mute); margin-bottom:14px;}
.cm-pack ul{margin:0; padding:0; list-style:none;}
.cm-pack li{font-size:14px; color:var(--cm-mute); padding:5px 0 5px 19px; position:relative;}
.cm-pack li.cm-on{color:var(--cm-text);}
.cm-pack li::before{content:""; position:absolute; left:2px; top:13px; width:7px; height:7px;
  border-radius:50%; border:1px solid var(--cm-rule);}
.cm-pack li.cm-on::before{background:var(--cm-gold); border-color:var(--cm-gold);}

/* The note runs the full width of the section and holds its own measure
   inside. Stopping the box itself at reading width leaves a stub under a
   full-width table, which reads as a layout that gave up rather than as a
   deliberate column. */
.cm-note{background:var(--cm-surface2); border:1px solid var(--cm-line);
  border-radius:var(--cm-r); padding:22px 26px; margin-top:24px;}
.cm-note p{margin:0; font-size:14px; color:var(--cm-mute); line-height:1.8;
  max-width:74ch;}
.cm-note p + p{margin-top:9px;}

.cm-brand{font-family:var(--cm-disp); font-weight:700; font-size:16px; letter-spacing:.05em;
  color:var(--cm-text);}
.cm-brand em{color:var(--cm-acc); font-style:normal;}
/* Sideways sliders. Built on scroll-snap, so a finger or a trackpad still
   works if the script fails. The arrows and dots are attached by the script
   at the end of this block. */
.cm-sl{margin-top:20px;}
.cm-sl-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.cm-sl-head p{margin:0; font-size:13.5px; color:var(--cm-mute); margin-right:auto;}
.cm-sl-btn{width:38px; height:38px; flex:0 0 auto; cursor:pointer;
  background:var(--cm-surface); color:var(--cm-text);
  border:1px solid var(--cm-line); border-radius:var(--cm-pill);
  font-family:var(--cm-body); font-size:15px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;}
.cm-sl-btn:hover:not([disabled]){border-color:var(--cm-gold);}
.cm-sl-btn[disabled]{opacity:.35; cursor:default;}
.cm-sl-track{
  display:grid; grid-auto-flow:column; grid-auto-columns:minmax(252px,1fr);
  gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
  scroll-behavior:smooth; scrollbar-width:none; padding-bottom:4px;
}
.cm-sl-track::-webkit-scrollbar{display:none;}
.cm-sl-track > *{scroll-snap-align:start;}
@media (min-width:760px){.cm-sl-track{grid-auto-columns:minmax(276px,1fr);}}
.cm-slide{
  background:var(--cm-surface); border:1px solid var(--cm-line);
  border-radius:var(--cm-r); padding:24px 22px 26px; min-width:0;
  box-shadow:var(--cm-lift);
}
.cm-slide .cm-n{margin-bottom:8px;}
.cm-slide h3{font-family:var(--cm-disp); font-weight:700; font-size:16px;
  margin:0 0 7px; color:var(--cm-text);}
.cm-slide p{margin:0; font-size:14px; color:var(--cm-mute); line-height:1.75;}
/* The lead slide carries a gold rule along its top edge. */
.cm-slide.cm-lead{border-top:3px solid var(--cm-gold);}
.cm-slide figure{margin:0;}
.cm-slide img{border:1px solid var(--cm-rule); border-radius:var(--cm-r2);}
.cm-slide figcaption{font-size:12.5px; color:var(--cm-mute); padding-top:10px;}
.cm-sl-dots{display:flex; gap:6px; margin-top:14px;}
.cm-sl-dot{width:22px; height:4px; border-radius:2px; background:var(--cm-line);
  border:0; padding:0; cursor:pointer;}
.cm-sl-dot[aria-current="true"]{background:var(--cm-gold);}
/* A hairline that fills as the slider runs. With eleven slides the dots stop
   telling anyone where they are; a filled line does it at a glance. */
.cm-sl-rail{position:relative; height:2px; margin-top:16px; border-radius:2px;
  background:var(--cm-line); overflow:hidden;}
.cm-sl-rail i{position:absolute; inset:0 auto 0 0; display:block; width:0;
  background:var(--cm-gold); border-radius:2px;
  transition:width .38s cubic-bezier(.2,.7,.3,1);}
/* Image variant. One picture per view, and the slide is the mount around it
   rather than a card with text in it. */
.cm-sl-img .cm-sl-track{grid-auto-columns:100%;}
@media (min-width:760px){.cm-sl-img .cm-sl-track{grid-auto-columns:100%;}}
.cm-sl-img .cm-slide{background:var(--cm-surface2); padding:16px; cursor:grab;
  transition:opacity .4s ease;}
/* The slide half out of frame is dimmed, so the eye is told which one is
   being shown without a border or a shadow being added to say it. */
.cm-anim .cm-sl-img .cm-slide{opacity:.34;}
.cm-anim .cm-sl-img .cm-slide.cm-here{opacity:1;}
.cm-sl-img .cm-slide:active{cursor:grabbing;}
/* The browser's own image drag would start instead of the slider's. */
.cm-sl-img .cm-slide img{width:100%; -webkit-user-drag:none; user-select:none;}

/* ── The opening band. A dot lattice at very low contrast, fading out as it
   falls, and one warm pool of light behind the headline. Both are painted
   with gradients rather than an image, so they cost nothing to load and stay
   sharp at any width. The band has to be positioned for them to sit inside. */
.cm-open{position:relative; overflow:hidden; isolation:isolate;}
.cm-open::before{
  content:""; position:absolute; inset:0; z-index:-2;
  background-image:radial-gradient(currentColor .9px, transparent 1px);
  background-size:24px 24px; color:var(--cm-mute);
  opacity:.26;
  -webkit-mask-image:linear-gradient(170deg,#000 0%,rgba(0,0,0,.45) 46%,transparent 86%);
  mask-image:linear-gradient(170deg,#000 0%,rgba(0,0,0,.45) 46%,transparent 86%);
}
/* A cool lift rather than a gold one. Gold spread thin over navy goes brown
   and reads as a stain on the photograph; the metal is worth more kept for
   the things that are actually gold, the buttons and the one live pin. */
.cm-open::after{
  content:""; position:absolute; z-index:-1;
  top:-46%; right:-18%; width:min(880px,96vw); aspect-ratio:1;
  background:radial-gradient(circle at 50% 50%,
    rgba(62,104,164,.42) 0%, rgba(40,70,112,.20) 38%, transparent 70%);
  pointer-events:none;
}
.cm-open > .cm-in{position:relative; z-index:1;}

/* Headline figures. These are the instrument's specification, not decoration,
   so they are allowed to be the largest thing after the headline. */
.cm-kpi{display:grid; gap:2px 0; margin:34px 0 4px;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--cm-line);}
.cm-kpi > div{padding:20px 22px 18px; border-bottom:1px solid var(--cm-line);
  border-right:1px solid var(--cm-line);}
.cm-kpi > div:first-child{padding-left:0;}
.cm-kpi b{display:block; font-family:var(--cm-disp); font-weight:700;
  font-size:clamp(28px,3.4vw,40px); line-height:1.05; letter-spacing:-.04em;
  color:var(--cm-text); font-variant-numeric:tabular-nums;}
.cm-kpi span{display:block; margin-top:8px; font-size:13px; color:var(--cm-mute);
  line-height:1.5;}
@media (max-width:620px){
  .cm-kpi > div{padding:16px 16px 15px;}
  .cm-kpi > div:nth-child(2n){border-right:0;}
}
@media (min-width:621px){.cm-kpi > div:last-child{border-right:0;}}

/* A short specification list under the figures, as label and value on one
   rule each. It replaces the bordered table the opening band used to carry. */
.cm-spec{margin-top:26px; border-top:1px solid var(--cm-line);}
.cm-spec div{display:grid; gap:4px 28px; padding:15px 0;
  border-bottom:1px solid var(--cm-line);}
@media (min-width:660px){.cm-spec div{grid-template-columns:11em minmax(0,1fr);}}
.cm-spec dt, .cm-spec b{font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--cm-mute); font-weight:600; padding-top:3px;}
.cm-spec span{font-size:14.5px; color:var(--cm-text);}

/* Sections arrive rather than appear. The starting state is added by script,
   never by this stylesheet: a reader whose JavaScript failed must not be left
   looking at a page of invisible blocks. */
.cm-anim .cm-rise{opacity:0; transform:translateY(14px);
  transition:opacity .62s cubic-bezier(.2,.7,.3,1), transform .62s cubic-bezier(.2,.7,.3,1);}
.cm-anim .cm-rise.cm-in-view{opacity:1; transform:none;}

/* ── The report's own charts, on the home page.
   One series, so there is no categorical palette and no legend: the tab
   above the chart names what is drawn. Gold carries the data and never
   carries text; every label and figure stays in the text tokens, because
   gold on white is 2.4:1 and unreadable as type. The figures are listed
   beside the shape, so nothing here depends on reading an angle. */
.cm-tabs{display:inline-flex; gap:4px; margin-top:6px; padding:4px;
  border:1px solid var(--cm-line); border-radius:var(--cm-pill);
  background:var(--cm-surface2);}
.cm-tabs button{font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  padding:9px 18px; border:0; border-radius:var(--cm-pill);
  background:transparent; color:var(--cm-mute);
  transition:background .2s, color .2s;}
.cm-tabs button[aria-pressed="true"]{background:var(--cm-surface); color:var(--cm-text);
  box-shadow:0 1px 2px rgba(15,27,45,.08);}
.cm-tabs button:hover[aria-pressed="false"]{color:var(--cm-text);}

.cm-chart{display:grid; gap:22px 40px; align-items:center; margin-top:22px;}
@media (min-width:820px){.cm-chart{grid-template-columns:minmax(0,7fr) minmax(0,5fr);}}
.cm-radarwrap{min-width:0;}
.cm-radar{display:block; width:100%; height:auto; overflow:visible;}
/* The hidden attribute is an HTML one: the browser's rule for it is namespaced
   to HTML elements, so on an <svg> it does nothing and both charts draw on top
   of each other. */
.cm-radar[hidden]{display:none;}
.cm-radar .cm-rg polygon{fill:none; stroke:var(--cm-line); stroke-width:1;}
.cm-radar .cm-rg-mid{stroke:var(--cm-rule);}
.cm-radar .cm-sp line{stroke:var(--cm-line); stroke-width:1;}
.cm-radar .cm-poly{fill:rgba(201,162,39,.16); stroke:var(--cm-gold); stroke-width:2;
  stroke-linejoin:round;}
.cm-radar .cm-vtx circle{fill:var(--cm-gold); stroke:var(--cm-surface); stroke-width:2;}
.cm-radar .cm-lab text{font-family:var(--cm-body); font-size:12.5px; font-weight:500;
  fill:var(--cm-mute);}
/* The shape opens from the centre once, and only when the script is there to
   close it first. With no script the polygon is already drawn correctly. */
.cm-anim .cm-radar .cm-poly,
.cm-anim .cm-radar .cm-vtx{
  transform-box:view-box; transform-origin:220px 176px; transform:scale(.02); opacity:0;
  transition:transform .85s cubic-bezier(.18,.72,.26,1), opacity .5s ease;
}
.cm-anim .cm-radar.cm-drawn .cm-poly,
.cm-anim .cm-radar.cm-drawn .cm-vtx{transform:none; opacity:1;}

<script>
/* Slider wiring. imweb sometimes inserts widgets late, so newly added
   sliders are picked up too. A marker is left so none is wired twice. */
(function () {
  function wire(sl) {
    if (sl.dataset.cmWired) return;
    sl.dataset.cmWired = "1";
    var track = sl.querySelector(".cm-sl-track");
    if (!track) return;
    var prev = sl.querySelector("[data-cm-prev]");
    var next = sl.querySelector("[data-cm-next]");
    var dots = sl.querySelector(".cm-sl-dots");
    var slides = Array.prototype.slice.call(track.children);
    /* Past four slides the dots stop telling anyone where they are, so the
       row is replaced by a rail that fills. Under that, dots are clearer and
       can be aimed at. One or the other, never both. */
    var rail = null;
    if (dots && slides.length > 4) {
      dots.hidden = true;
      rail = document.createElement("div");
      rail.className = "cm-sl-rail";
      rail.appendChild(document.createElement("i"));
      dots.parentNode.insertBefore(rail, dots.nextSibling);
      rail = rail.firstChild;
    }

    function step() {
      var a = slides[0], b = slides[1];
      return b ? b.offsetLeft - a.offsetLeft : (a ? a.offsetWidth : 300);
    }
    function idx() { return Math.round(track.scrollLeft / step()); }
    function go(i) {
      var max = slides.length - 1;
      i = Math.max(0, Math.min(max, i));
      track.scrollTo({ left: slides[i] ? slides[i].offsetLeft - slides[0].offsetLeft : 0 });
    }
    if (prev) prev.addEventListener("click", function () { go(idx() - 1); });
    if (next) next.addEventListener("click", function () { go(idx() + 1); });

    if (dots && !rail) {
      slides.forEach(function (_, i) {
        var d = document.createElement("button");
        d.type = "button";
        d.className = "cm-sl-dot";
        d.setAttribute("aria-label", "Go to slide " + (i + 1));
        d.addEventListener("click", function () { go(i); });
        dots.appendChild(d);
      });
    }
    track.setAttribute("tabindex", "0");
    track.setAttribute("role", "group");
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); go(idx() + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(idx() - 1); }
    });

    function sync() {
      var atStart = track.scrollLeft <= 2;
      var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
      if (prev) prev.disabled = atStart;
      if (next) next.disabled = atEnd;
      var i = idx();
      if (dots && !rail) {
        Array.prototype.forEach.call(dots.children, function (d, k) {
          d.setAttribute("aria-current", k === i ? "true" : "false");
        });
      }
      if (rail) rail.style.width = ((i + 1) / slides.length * 100) + "%";
      slides.forEach(function (sd, k) { sd.classList.toggle("cm-here", k === i); });
    }
    track.addEventListener("scroll", sync, { passive: true });
    window.addEventListener("resize", sync);
    sync();

    /* Drag with a mouse or a trackpad, on image sliders only. On a text
       slide the same gesture is how someone selects a line, so taking it
       over there would break selection to gain nothing. Touch already
       scrolls natively and is left alone. */
    if (sl.classList.contains("cm-sl-img")) {
      var down = false, startX = 0, startLeft = 0, moved = false;
      track.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "touch") return;
        down = true; moved = false;
        startX = e.clientX; startLeft = track.scrollLeft;
        /* Snapping has to come off for the duration. Mandatory snap pulls the
           scroll position back to the nearest slide after every write, so a
           drag made of small steps never leaves the slide it started on. */
        track.style.scrollSnapType = "none";
        track.style.scrollBehavior = "auto";
      });
      track.addEventListener("pointermove", function (e) {
        if (!down) return;
        var d = e.clientX - startX;
        if (Math.abs(d) > 3) moved = true;
        track.scrollLeft = startLeft - d;
      });
      function release() {
        if (!down) return;
        down = false;
        track.style.scrollSnapType = "";
        track.style.scrollBehavior = "";
        if (moved) go(idx());
      }
      track.addEventListener("pointerup", release);
      track.addEventListener("pointercancel", release);
      track.addEventListener("pointerleave", release);
      track.addEventListener("dragstart", function (e) { e.preventDefault(); });
    }

    /* Advance on its own, if the section asks for it with data-cm-auto.
       It stops under the pointer, while anything inside has focus, and on a
       hidden tab: a slide that moves while it is being read is worse than
       one that never moves. Reduced motion turns it off entirely. */
    var every = parseInt(sl.getAttribute("data-cm-auto") || "0", 10);
    var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (every >= 2000 && slides.length > 1 && !still) {
      var timer = null;
      var stop = function () { if (timer) { clearInterval(timer); timer = null; } };
      var start = function () {
        stop();
        timer = setInterval(function () {
          var i = idx();
          go(i >= slides.length - 1 ? 0 : i + 1);
        }, every);
      };
      sl.addEventListener("mouseenter", stop);
      sl.addEventListener("mouseleave", start);
      sl.addEventListener("focusin", stop);
      sl.addEventListener("focusout", start);
      sl.addEventListener("pointerdown", stop);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { stop(); } else { start(); }
      });
      start();
    }
  }
  function scan() { document.querySelectorAll(".cm-sl").forEach(wire); }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else { scan(); }
  if (window.MutationObserver) {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  }
})();

/* The two profiles behind one chart.
   Without this the first profile is the one on the page and the second is
   hidden, which is still a correct page: the figures beside the shape are
   what a reader actually reads off, and both lists are in the markup. */
(function () {
  function wire(tabs) {
    if (tabs.dataset.cmWired) return;
    tabs.dataset.cmWired = "1";
    var scope = tabs.closest(".cm-in") || document;
    var btns = Array.prototype.slice.call(tabs.querySelectorAll("[data-cm-tab]"));

    function pick(key) {
      btns.forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.cmTab === key ? "true" : "false");
      });
      scope.querySelectorAll("[data-cm-vals]").forEach(function (v) {

      });
      scope.querySelectorAll("[data-cm-radar]").forEach(function (r) {
        var on = r.dataset.cmRadar === key;

           the shape being made rather than swapping one picture for another. */

          requestAnimationFrame(function () {
            requestAnimationFrame(function () { r.classList.add("cm-drawn"); });

    btns.forEach(function (b, i) {
      b.addEventListener("click", function () { pick(b.dataset.cmTab); });
      b.addEventListener("keydown", function (e) {
        var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        var nx = btns[(i + d + btns.length) % btns.length];
        nx.focus(); pick(nx.dataset.cmTab);
      });
    });
  }

  /* One sample item that can actually be answered. The readout is not a score:
     a single item cannot produce one, and pretending otherwise would be the
     first lie the site tells. It says what that answer feeds. */
  function wireTry(box) {
    if (box.dataset.cmWired) return;
    box.dataset.cmWired = "1";
    var out = box.querySelector(".cm-try-out");
    var btns = Array.prototype.slice.call(box.querySelectorAll("[data-cm-pick]"));
    btns.forEach(function (b) {
      b.addEventListener("click", function () {
        btns.forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
        if (!out) return;
        out.hidden = false;
        out.querySelectorAll("[data-cm-answer]").forEach(function (el) {
          el.textContent = b.dataset.cmPick;
        });
      });
    });
  }

  /* The bar that follows the reader down. Shown once most of a page has gone
     past, closed for good when closed: it remembers in this browser only, and
     a browser that refuses to remember simply shows it again next visit. */
  function wireDock(dock) {
    if (dock.dataset.cmWired) return;
    dock.dataset.cmWired = "1";
    var KEY = "cm-dock-closed";
    try { if (localStorage.getItem(KEY) === "1") { dock.remove(); return; } } catch (e) {}
    var x = dock.querySelector(".cm-x");
    if (x) x.addEventListener("click", function () {
      dock.classList.remove("cm-up");
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      setTimeout(function () { dock.remove(); }, 420);
    });
    var tick = function () {
      var h = document.documentElement;
      var seen = (h.scrollTop + window.innerHeight) / Math.max(h.scrollHeight, 1);
      dock.classList.toggle("cm-up", seen > 0.55);
    };
    window.addEventListener("scroll", tick, { passive: true });
    window.addEventListener("resize", tick);
    tick();
  }

  function scan() {
    document.querySelectorAll(".cm-tabs").forEach(wire);
    document.querySelectorAll(".cm-try").forEach(wireTry);
    document.querySelectorAll(".cm-dock").forEach(wireDock);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else { scan(); }
  if (window.MutationObserver) {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script>
/* Sections arrive as they are reached, and the specification figures count up
   the first time they are seen.

   The starting state lives behind .cm-anim, and that class is only added once
   this script has an IntersectionObserver to hand. A stylesheet that hides
   blocks up front would leave a reader with broken JavaScript looking at an
   empty page, which is worse than a page that does not move. */
(function () {
  if (!("IntersectionObserver" in window)) return;
  var root = document.documentElement;
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.classList.add("cm-anim");

  function run(el) {
    var figs = el.querySelectorAll ? el.querySelectorAll("[data-cm-count]") : [];
    Array.prototype.forEach.call(figs, function (f) {
      if (f.dataset.cmCounted) return;
      f.dataset.cmCounted = "1";
      var to = Number(f.getAttribute("data-cm-count"));
      /* The element's own text is the real value and is always put back at
         the end, so nothing on the page depends on the animation finishing. */
      var settled = f.textContent;
      if (!isFinite(to) || still) return;
      var t0 = 0;
      requestAnimationFrame(function step(ts) {
        if (!t0) t0 = ts;
        var k = Math.min(1, (ts - t0) / 900);
        var e = 1 - Math.pow(1 - k, 3);
        f.textContent = Math.round(to * e).toLocaleString("en-US");
        if (k < 1) requestAnimationFrame(step); else f.textContent = settled;
      });
    });
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      var wait = still ? 0 : Number(e.target.dataset.cmDelay || 0);
      setTimeout(function () {
        e.target.classList.add("cm-in-view");
        if (e.target.classList.contains("cm-radar")) e.target.classList.add("cm-drawn");
        run(e.target);
      }, wait);
    });
  }, { rootMargin: "0px 0px -7% 0px", threshold: 0.04 });

  function mark(el, delay) {
    if (el.dataset.cmRise) return;
    el.dataset.cmRise = "1";
    el.classList.add("cm-rise");
    if (delay) el.dataset.cmDelay = String(delay);
    io.observe(el);
  }

  function scan() {
    /* Targets are found rather than declared, so a widget added later needs
       no class of its own and the two sites cannot drift apart. */
    document.querySelectorAll(".cm > .cm-in").forEach(function (inner) {
      Array.prototype.forEach.call(inner.children, function (child, i) {
        mark(child, Math.min(i, 4) * 70);
      });
    });
    /* The radar opens from the centre. It is observed on its own rather than
       through its container, so the shape starts drawing when the chart is
       reached and not when the section above it is. */
    document.querySelectorAll(".cm-radar").forEach(function (r) {
      if (r.dataset.cmRise) return;
      r.dataset.cmRise = "1";
      io.observe(r);
    });
    document.querySelectorAll(".cm-map-pins").forEach(function (g) {
      if (g.dataset.cmRise) return;
      g.dataset.cmRise = "1";
      Array.prototype.forEach.call(g.children, function (pin, i) {
        pin.style.transitionDelay = still ? "0ms" : (140 + i * 80) + "ms";
      });
      io.observe(g);
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", scan);
  } else { scan(); }
  if (window.MutationObserver) {
    new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
