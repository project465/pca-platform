# 한 대에 전부 올리는 가장 작은 구성.
#
# 도메인과 인증서는 앞단(Caddy·nginx·클라우드 LB)이 맡는다. 여기서는
# 플랫폼과 DB 만 띄운다 — 처음 한 학교를 받는 데 이보다 클 필요가 없다.
#
#   cp .env.example .env.production   # 값을 채운다
#   docker compose up -d
#   docker compose exec -T db psql -U metri metri < db/schema.sql
#   docker compose exec -T db psql -U metri metri < db/schema_metri.sql

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 정하십시오}
      POSTGRES_DB: metri
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metri -d metri"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 밖으로 열지 않는다. 앱만 같은 네트워크에서 붙는다
    expose: ["5432"]

  app:
    build: .
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      DATABASE_URL: postgres://metri:${POSTGRES_PASSWORD}@db:5432/metri
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]

  # 밤 당번. 5분마다 앱을 한 번 두드린다 — 쌓인 알림이 나가고 코드
  # 재고를 센다. 앱 안에서 타이머를 돌리지 않는 것은 일부러다:
  # 앱을 여러 개로 늘리면 타이머도 같이 늘어 같은 메일이 여러 번 나간다.
  tick:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: [.env.production]
    depends_on: [app]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$OPS_TOKEN" \
            http://app:3000/api/ops/tick || echo "tick 실패 $$(date -Iseconds)"
          sleep 300
        done

volumes:
  dbdata:
